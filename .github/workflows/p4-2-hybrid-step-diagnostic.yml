name: P4.2 hybrid step diagnostic

on:
  push:
    branches:
      - sol-p4-2-hybrid-step-diagnostic

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python - <<'PY'
          from pathlib import Path
          import tempfile
          from ate_sim import Simulation, generate_world
          from ate_sim.persistence_session import write_cold_snapshot
          from ate_sim.persistence_lazy import convert_cold_to_lazy, open_lazy_world_session
          from ate_sim.persistence_adapters import META, COLLECTION_LAYOUT, RECORD_SCHEMA
          RULES="diag-hybrid-step"
          with tempfile.TemporaryDirectory() as d:
              d=Path(d)
              w=generate_world(918273,width=8,height=6,settlements=1)
              w.event_ids={event.id for event in w.events}
              cold=d/"cold.sqlite"; lazy=d/"lazy.sqlite"
              write_cold_snapshot(w,cold,rules_id=RULES)
              convert_cold_to_lazy(cold,lazy,rules_id=RULES)
              s=open_lazy_world_session(lazy,rules_id=RULES)
              try:
                  print("BEFORE_LEN",len(s.world.lineage.nodes))
                  Simulation(s.world).step()
                  print("AFTER_LEN",len(s.world.lineage.nodes))
                  print("MANIFEST_DIRTY",s._eager_tracker._manifest_dirty)
                  plan=s._prepare_hybrid_save()
                  print("PLAN_NONE",plan is None)
                  print("PLAN_LAYOUT_LINEAGE",None if plan is None or plan.cold_plan.layout_value is None else plan.cold_plan.layout_value["world.lineage.nodes"])
                  print("PLAN_CHANGE_LAYOUT",[(c.namespace,c.key) for c in (plan.cold_plan.changes if plan else ()) if c.namespace==META])
                  # Clear prepared-only state and perform the normal save path.
                  s._eager_tracker._cold_plan=None
                  s._eager_tracker._cold_publication_phase=None
                  s._eager_tracker._cold_state="active"
                  gen=s.save()
                  print("SAVED_GEN",gen)
                  print("HEAD_COUNT",s.store.checked_head().namespace_counts.get("world.lineage.nodes"))
                  metadata={k:v for k,v,_ in s.store.read_records(META,expected_record_schema=RECORD_SCHEMA)}
                  layout=metadata.get(COLLECTION_LAYOUT)
                  print("STORED_LAYOUT_LINEAGE",None if layout is None else layout["world.lineage.nodes"])
              finally:
                  s.close()
          PY
