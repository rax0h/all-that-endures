name: Hot working set profile 100

on:
  push:
    branches:
      - sol-stage-0-5-hot-working-set-profile-100

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Profile 50-100 lazy simulation and save
        run: |
          python - <<'PY'
          import cProfile, pstats, tempfile, time
          from pathlib import Path
          from ate_sim.engine import Simulation
          from ate_sim.persistence_lazy import convert_cold_to_lazy, open_lazy_world_session
          from ate_sim.persistence_session import write_cold_snapshot
          from ate_sim.worldgen import generate_world

          rules="hot-working-set-profile-100"
          with tempfile.TemporaryDirectory() as td:
              td=Path(td); cold=td/"cold.sqlite"; lazy=td/"lazy.sqlite"
              source=generate_world(843000); Simulation(source).run(3)
              write_cold_snapshot(source,cold,rules_id=rules)
              convert_cold_to_lazy(cold,lazy,rules_id=rules)
              with open_lazy_world_session(lazy,rules_id=rules) as session:
                  Simulation(session.world).run(47)
                  session.save()
                  session.close()
              with open_lazy_world_session(lazy,rules_id=rules) as session:
                  session.store.reset_diagnostics()
                  prof=cProfile.Profile(); prof.enable(); t=time.perf_counter()
                  Simulation(session.world).run(50)
                  sim=time.perf_counter()-t; prof.disable()
                  print("PROFILE_50_100_SIM",sim)
                  print("PROFILE_50_100_IO",session.store.diagnostics())
                  pstats.Stats(prof).strip_dirs().sort_stats("cumtime").print_stats(60)

                  session.store.reset_diagnostics()
                  prof=cProfile.Profile(); prof.enable(); t=time.perf_counter()
                  session.save()
                  save=time.perf_counter()-t; prof.disable()
                  print("PROFILE_YEAR100_SAVE",save)
                  print("PROFILE_YEAR100_SAVE_IO",session.store.diagnostics())
                  pstats.Stats(prof).strip_dirs().sort_stats("cumtime").print_stats(60)
          PY
