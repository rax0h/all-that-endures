name: P4.13 community scaling

on:
  push:
    branches:
      - sol-p4-13-community-scaling

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python - <<'PY'
          from pathlib import Path
          import tempfile
          from ate_sim.core import World
          from ate_sim.persistence_session import write_cold_snapshot
          from ate_sim.persistence_lazy import convert_cold_to_lazy, open_lazy_world_session

          RULES="p4-13-community-scaling"

          def build(n):
              w=World(862000+n)
              community=w.communities.create("founder_network",0,1)
              for pid in range(1,n+1):
                  w.communities.join(pid,community.id,0.5)
              return w

          def measure(n):
              with tempfile.TemporaryDirectory() as td:
                  td=Path(td)
                  cold=td/"cold.sqlite"
                  lazy=td/"lazy.sqlite"
                  write_cold_snapshot(build(n),cold,rules_id=RULES)
                  convert_cold_to_lazy(cold,lazy,rules_id=RULES)
                  with open_lazy_world_session(lazy,rules_id=RULES) as s:
                      open_diag=s.store.diagnostics()
                      assert s.community_memberships.diagnostics()[
                          "community_membership_payload_loads"
                      ] == 0

                      s.store.reset_diagnostics()
                      assert s.world.communities.memberships_for(1)=={1:0.5}
                      point_diag=s.store.diagnostics()

                      s.store.reset_diagnostics()
                      s.world.communities.join(1,1,0.8)
                      s.save()
                      save_diag=s.store.diagnostics()

                      result={
                          "n":n,
                          "open_payload_reads":open_diag.payload_reads,
                          "open_payload_bytes":open_diag.payload_read_bytes,
                          "point_payload_reads":point_diag.payload_reads,
                          "point_payload_bytes":point_diag.payload_read_bytes,
                          "save_payload_writes":save_diag.payload_writes,
                          "save_payload_write_bytes":save_diag.payload_write_bytes,
                          "resident_memberships":s.community_memberships.diagnostics()[
                              "resident_community_memberships"
                          ],
                      }
                      print("COMMUNITY_MEMBERSHIP_AFTER",result)
                      return result

          small=measure(1000)
          large=measure(10000)
          assert small["open_payload_reads"] == large["open_payload_reads"]
          assert small["point_payload_reads"] == large["point_payload_reads"] == 1
          assert small["save_payload_writes"] == large["save_payload_writes"]
          assert large["resident_memberships"] <= 1
          PY
