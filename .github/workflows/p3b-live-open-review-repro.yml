name: p3b-live-open-review-repro
on:
  push:
    branches: [sol/p3b-live-open-review-fixes]
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: reproduce six review failures
        run: >-
          python -m pytest -q
          simulation/tests/test_persistence_session_open.py
          -k "review_"
