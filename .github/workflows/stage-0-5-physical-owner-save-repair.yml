name: Stage 0.5 physical-owner save repair - mature paused
'on':
  push:
    branches: [sol/stage-0-5-physical-owner-save-repair]
    paths: [.github/workflows/stage-0-5-physical-owner-save-repair.yml]
permissions:
  contents: read
concurrency:
  group: stage-0-5-physical-owner-save-repair
  cancel-in-progress: false
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install pytest pyyaml
    - name: Physical-owner save and affected publication regressions
      shell: bash
      run: |
        mkdir -p evidence
        timeout --signal=TERM --kill-after=30s 17m python -m pytest -q \
          simulation/tests/test_stage_0_5_final_orphan_owner_save.py \
          simulation/tests/test_stage_0_5_final_identity_only_headers.py \
          simulation/tests/test_stage_0_5_final_world_recursive_histories.py \
          simulation/tests/test_stage_0_5_final_world_recursive_records.py \
          simulation/tests/test_stage_0_5_final_recursive_value_records.py \
          simulation/tests/test_stage_0_5_final_recursive_source_lifetimes.py \
          simulation/tests/test_stage_0_5_final_recursive_record_owner_cycles.py \
          simulation/tests/test_stage_0_5_final_world_backing_retirement.py \
          simulation/tests/test_stage_0_5_final_world_identity_compaction.py \
          simulation/tests/test_stage_0_5_final_catalog_publication.py \
          simulation/tests/test_stage_0_5_final_coordinator_header_witnesses.py \
          simulation/tests/test_stage_0_5_final_identity_coordinator.py \
          simulation/tests/test_stage_0_5_final_world_catalog_bridge.py \
          simulation/tests/test_stage_0_5_final_participant_abort.py \
          simulation/tests/test_stage_0_5_final_world_participants.py \
          simulation/tests/test_stage_0_5_final_identity_headers.py \
          simulation/tests/test_stage_0_5_final_owner_header_witnesses.py \
          --junitxml=evidence/focused.xml 2>&1 | tee evidence/focused.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: physical-owner-save-focused
        path: evidence
        retention-days: 14
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    needs: [focused]
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install pytest pyyaml
    - name: Full simulation suite
      shell: bash
      run: |
        mkdir -p evidence
        timeout --signal=TERM --kill-after=30s 135m python -m pytest -q simulation/tests \
          --junitxml=evidence/full-suite.xml 2>&1 | tee evidence/full-suite.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: physical-owner-save-full-suite
        path: evidence
        retention-days: 14
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [focused]
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install pytest pyyaml
    - name: Complete recovery and exact continuation
      shell: bash
      run: |
        mkdir -p evidence
        ulimit -v 8388608
        timeout --signal=TERM --kill-after=30s 20m bash -c '
          python -m simulation.measure_stage_0_5_complete_recovery --output evidence/fault-recovery.json &&
          python -m simulation.persistence_p5_validation --complete-format --pre-years 3 \
            --continuation-years 4 --reopen-years 3 --output evidence/recovery-3-4-3.json
        ' 2>&1 | tee evidence/recovery.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: physical-owner-save-recovery
        path: evidence
        retention-days: 14
