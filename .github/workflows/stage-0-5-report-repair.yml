name: Stage 0.5 treasury report repair - mature paused
'on':
  push:
    branches: [astra/stage-0-5-continuation-recovery]
    paths: [.github/workflows/stage-0-5-report-repair.yml]
permissions:
  contents: read
concurrency:
  group: stage-0-5-report-repair
  cancel-in-progress: false
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install pytest pyyaml
    - name: Report and continuation compatibility
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p evidence
        timeout --signal=TERM --kill-after=30s 17m python -m pytest -q \
          simulation/tests/test_long_history_report_treasuries.py \
          simulation/tests/test_stage_0_5_final_long_harness.py \
          simulation/tests/test_construction_mature_continue.py \
          simulation/tests/test_checkpoint_artifacts.py \
          --junitxml=evidence/focused.xml 2>&1 | tee evidence/focused.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: treasury-report-focused
        path: evidence
        retention-days: 14
  full-suite:
    needs: [focused]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install pytest pyyaml
    - name: Full simulation suite
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p evidence
        timeout --signal=TERM --kill-after=30s 135m python -m pytest -q simulation/tests \
          --junitxml=evidence/full-suite.xml 2>&1 | tee evidence/full-suite.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: treasury-report-full-suite
        path: evidence
        retention-days: 14
