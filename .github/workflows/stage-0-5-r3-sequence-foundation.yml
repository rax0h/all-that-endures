name: stage-0-5-r3-sequence-foundation
on:
  push:
    branches: [sim/stage-0-5-r3-implementation]
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - run: python -m pytest -sv -q simulation/tests/test_stage_0_5_household_sequence.py simulation/tests/test_stage_0_5_paged_household_world.py

# Recheck rollback, generations and page deletion

# Gate opt-in World projection after future-import fix

# World open checked snapshot reuse

# Atomic household scalar, detach and stale-writer gate
      - name: Independent P5 short paged-household continuation
        run: python simulation/persistence_p5_validation.py --seed 843000 --pre-years 3 --continuation-years 4 --reopen-years 3 --paged-households --output /tmp/p5-r3-short.json
