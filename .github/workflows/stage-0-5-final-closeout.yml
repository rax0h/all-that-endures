name: Stage 0.5 final closeout

on:
  push:
    branches:
      - sol-stage-0-5-final-closeout

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run closeout compatibility preflight
        run: |
          python -m pytest -q \
            simulation/tests/test_community_index.py::test_membership_index_preserves_order_strength_inheritance_and_checkpoint \
            simulation/tests/test_persistence_p2b_review_regressions.py::test_r2_rejected_nested_cycle_and_extended_slice_leave_tracking_intact \
            simulation/tests/test_persistence_lazy_people.py::test_lazy_packed_agency_trim_saves_and_reopens

  full-suite:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run complete simulation test suite
        run: python -m pytest -q simulation/tests

  short-closeout:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Canonical 10-year smoke
        run: python simulation/specific_test.py --seed 843000 --years 10 --section all
      - name: Recovery lifecycle compatibility battery
        run: |
          python -m pytest -q \
            simulation/tests/test_persistence_lazy_store_failures.py \
            simulation/tests/test_persistence_lifecycle.py \
            simulation/tests/test_persistence_session_open.py \
            simulation/tests/test_persistence_cold_save_failures.py \
            simulation/tests/test_persistence_lazy_identity.py \
            simulation/tests/test_persistence_p2c.py
      - name: P5 short integrated continuation
        run: |
          python simulation/persistence_p5_validation.py \
            --seed 843000 \
            --pre-years 3 \
            --continuation-years 4 \
            --reopen-years 3 \
            --output p5-short-final.json
      - name: Print P5 short summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("p5-short-final.json").read_text())
          print("P5_SHORT_PASSED",data["passed"])
          print("TOTAL_YEAR",data["total_year"])
          print("FINAL_YEAR",data["final_year"])
          print("CONTROL_FINAL_DIGEST",data["control_final_digest"])
          print("EVENTS_TOTAL",data["events_total"])
          print("LAST_EVENT_ID",data["last_event_id"])
          print("FIRST_CONTINUATION_SECONDS",data["first_continuation_simulation_seconds"])
          print("SECOND_CONTINUATION_SECONDS",data["second_continuation_simulation_seconds"])
          PY
