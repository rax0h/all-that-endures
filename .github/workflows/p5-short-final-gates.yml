name: P5 short final gates

on:
  push:
    branches:
      - sol-p5-short-final-gates

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          PYTHONPATH=.:simulation python simulation/specific_test.py             --seed 843000 --years 10 --section all > p5-specific-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-specific-smoke
          path: p5-specific-smoke.json

  failure-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python -m pytest -q             simulation/tests/test_persistence_lazy_store_failures.py             simulation/tests/test_persistence_lifecycle.py             simulation/tests/test_persistence_session_open.py             simulation/tests/test_persistence_lazy_identity.py
