name: simulation
on:
  push:
    branches: [main, sim/current-standard]
  pull_request:
    branches: [main]

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: unit and integration suite with timing
        run: pytest -vv --durations=20 simulation/tests
      - name: targeted probe smoke test
        run: python simulation/specific_test.py --seed 843000 --years 10 --section all
      - name: deterministic 100-year smoke history
        run: python simulation/run_long_history.py 843000 100
      - name: canonical 1000-year progression validation
        run: |
          set -o pipefail
          benchmark_status=0
          # Stage 0.5 owner decision: 120s is an optimization goal, not a hard
          # acceptance threshold. Keep all correctness/audit failures fatal.
          python simulation/run_long_history.py 843000 1000 --archive /tmp/ate-canonical.sqlite | tee /tmp/canonical-millennium.log || benchmark_status=$?
          python -c 'import json; rows=[json.loads(s) for s in open("/tmp/canonical-millennium.log")]; b=next(r for r in rows if r.get("record")=="benchmark"); t=b["simulation_seconds"]; print(f"::warning::Millennium {t:.2f}s exceeds the 120s optimization goal" if t>120 else f"Millennium {t:.2f}s meets the optimization goal")'
          audit_status=0
          python simulation/validate_magic_progression.py /tmp/ate-canonical.sqlite | tee /tmp/canonical-validation.log || audit_status=$?
          if (( benchmark_status != 0 || audit_status != 0 )); then exit 1; fi
