name: simulation
on:
  push:
    branches: [main, sim/current-standard, sim/magic-liquidity-exchange]
  pull_request:
    branches: [main]

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: isolated 1000-year liquidity calibration
        run: python simulation/run_long_history.py 843000 1000 --max-seconds 120
