name: simulation
# diagnostic branch exists only to expose the Stage 0.5 profiler independently
on:
  push:
    branches: [main, sim/current-standard, diagnostic/stage-0.5-profile]
  pull_request:
    branches: [main]

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: diagnostic 300-year late profile
        env:
          ATE_PROFILE_TAIL: '40'
        run: python simulation/run_long_history.py 843000 300

  test:
    needs: profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: unit and integration suite with timing
        run: pytest -vv --durations=20 simulation/tests
      - name: targeted probe smoke test
        run: python simulation/specific_test.py --seed 843000 --years 10 --section all
      - name: deterministic 100-year smoke history
        run: python simulation/run_long_history.py 843000 100
      - name: canonical 1000-year progression validation
        run: |
          set -o pipefail
          python simulation/run_long_history.py 843000 1000 --max-seconds 120 --archive /tmp/ate-canonical.sqlite | tee /tmp/canonical-millennium.log
          python simulation/validate_magic_progression.py /tmp/ate-canonical.sqlite | tee /tmp/canonical-validation.log
