name: simulation
on:
  pull_request:
    branches: [main]

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: compile touched persistence modules
        run: python -m py_compile simulation/ate_sim/materials.py simulation/ate_sim/persistence_lazy.py
      - name: focused lazy material family gate
        run: pytest -q simulation/tests/test_persistence_lazy_materials.py simulation/tests/test_material_selection_index.py simulation/tests/test_persistence_lazy_resources.py
