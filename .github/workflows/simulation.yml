name: simulation
on:
  push:
    branches: [main, sim/current-standard]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q simulation/tests
      - name: 300-year smoke run
        run: |
          python - <<'PY'
          from ate_sim.worldgen import generate_world
          from ate_sim.engine import Simulation
          w=generate_world(843000)
          Simulation(w).run(300)
          print({
            'year':w.year,
            'alive':sum(p.alive for p in w.people.values()),
            'people_total':len(w.people),
            'households':len(w.households),
            'events':len(w.events),
            'practices':len(w.culture.practices),
            'institutions':len(w.culture.institutions),
            'laws':len(w.culture.laws),
            'properties':len(w.economy.property),
            'relationships':len(w.social.edges),
            'genealogies':len(w.genealogy.parents),
            'digest':w.digest(),
          })
          PY
