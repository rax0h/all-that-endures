name: simulation
on:
  push:
    branches: [main, sim/current-standard]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: unit and integration suite with timing
        run: pytest -vv --durations=20 simulation/tests
      - name: multi-seed 300-year calibration
        run: python simulation/calibration_check.py
      - name: 1000-year current-standard run
        run: python simulation/run_long_history.py 843000 1000
      - name: 10000-year stress run
        run: python simulation/run_long_history.py 843000 10000
