name: P4.11A lineage focused

on:
  push:
    branches:
      - sol-p4-11a-lineage-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python -m pytest -q \
            simulation/tests/test_persistence_lazy_lineage.py \
            simulation/tests/test_history_networks.py
