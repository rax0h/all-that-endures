name: Stage 0.6 durable proof map validation
'on':
  push:
    branches: [sol/durable-proof-map]
    paths:
      - simulation/ate_sim/**
      - simulation/tests/**
      - .github/tests/run_proof_map_scaling.py
      - .github/tests/run_proof_batch_scaling.py
      - .github/tests/run_proof_order_scaling.py
      - .github/tests/run_proof_query_scaling.py
      - .github/tests/run_proof_version_scaling.py
      - .github/tests/run_proof_occurrence_scaling.py
      - .github/tests/run_proof_seek_scaling.py
      - .github/tests/run_proof_projection_scaling.py
      - .github/tests/run_proof_identity_group_scaling.py
      - .github/tests/run_proof_record_scaling.py
      - .github/tests/run_proof_scope_scaling.py
      - .github/tests/run_proof_publication_scaling.py
      - .github/tests/run_proof_collection_scaling.py
      - .github/tests/run_proof_collection_publication_scaling.py
      - .github/tests/run_proof_collection_directory_scaling.py
      - .github/tests/run_proof_directory_publication_scaling.py
      - .github/tests/run_proof_inventory_scaling.py
      - .github/tests/run_proof_target_scaling.py
      - .github/tests/run_proof_owner_targets_scaling.py
      - .github/tests/run_proof_target_group_scaling.py
      - .github/tests/run_proof_target_incoming_scaling.py
      - .github/tests/run_proof_child_extents_scaling.py
      - .github/tests/run_proof_frozen_extents_scaling.py
      - .github/tests/run_proof_sequence_event_extents_scaling.py
      - .github/tests/run_proof_reference_closure_scaling.py
      - .github/tests/run_proof_reference_scaling.py
      - .github/tests/run_proof_world_manifest_scaling.py
      - .github/tests/run_proof_native_value_scaling.py
      - .github/tests/run_proof_native_insert_scaling.py
      - .github/workflows/stage-0-5-proof-map-validation.yml
      - simulation/stage_0_6_proof_genesis_request.json
permissions:
  contents: read
concurrency:
  group: stage-0-5-proof-map-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
jobs:
  mature-genesis-request:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.request.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: request
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" -- simulation/stage_0_6_proof_genesis_request.json | grep -q .; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
  proof-map:
    runs-on: ubuntu-latest
    # The previous green job used 52m; retain room for the added forest matrix
    # and observed hosted variance. Individual scaling commands stay bounded.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Record proof job candidate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import platform, sqlite3, subprocess
          from pathlib import Path
          from simulation import continuation_receipts as r
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          if git('status','--porcelain','--untracked-files=no'):raise ValueError('tracked execution source is dirty')
          r.publish_receipt(Path('evidence/source.json'),dict(head=git('rev-parse','HEAD'),runtime_tree=git('rev-parse','HEAD:simulation/ate_sim'),python=platform.python_version(),sqlite=sqlite3.sqlite_version))
          PY
      - name: Verify proof primitives and bounded 1k/10k/100k work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m pytest -q simulation/tests/test_stage_0_6_proof_node_factorization.py --junitxml=evidence/node-factorization-tests.xml 2>&1 | tee evidence/node-factorization-tests.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_nodes.py simulation/tests/test_stage_0_5_proof_map.py simulation/tests/test_stage_0_5_proof_store.py simulation/tests/test_stage_0_5_proof_batch.py simulation/tests/test_stage_0_5_proof_content.py simulation/tests/test_stage_0_5_proof_order.py simulation/tests/test_stage_0_5_proof_order_edit.py simulation/tests/test_stage_0_5_proof_query.py simulation/tests/test_stage_0_5_proof_version.py simulation/tests/test_stage_0_5_proof_occurrence.py --junitxml=evidence/proof-tests.xml 2>&1 | tee evidence/proof-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_map_scaling.py --output evidence/scaling 2>&1 | tee evidence/scaling.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_batch_scaling.py --output evidence/batch-scaling 2>&1 | tee evidence/batch-scaling.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_order_scaling.py --output evidence/order-scaling 2>&1 | tee evidence/order-scaling.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_query_scaling.py --output evidence/query-scaling 2>&1 | tee evidence/query-scaling.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_version_scaling.py --output evidence/version-scaling 2>&1 | tee evidence/version-scaling.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_occurrence_scaling.py --output evidence/occurrence-scaling 2>&1 | tee evidence/occurrence-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_seek.py simulation/tests/test_stage_0_5_proof_occurrence_seek.py --junitxml=evidence/seek-tests.xml 2>&1 | tee evidence/seek-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_seek_scaling.py --output evidence/seek-scaling 2>&1 | tee evidence/seek-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_projection.py --junitxml=evidence/projection-tests.xml 2>&1 | tee evidence/projection-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_projection_scaling.py --output evidence/projection-scaling 2>&1 | tee evidence/projection-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_query_seek.py simulation/tests/test_stage_0_5_proof_identity_group.py --junitxml=evidence/group-tests.xml 2>&1 | tee evidence/group-tests.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_generation.py --junitxml=evidence/generation-tests.xml 2>&1 | tee evidence/generation-tests.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_record.py --junitxml=evidence/record-tests.xml 2>&1 | tee evidence/record-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_record_scaling.py --output evidence/record-scaling 2>&1 | tee evidence/record-scaling.log
          python -m pytest -q --capture=sys simulation/tests/test_stage_0_5_proof_scope.py --junitxml=evidence/scope-tests.xml 2>&1 | tee evidence/scope-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_scope_scaling.py --output evidence/scope-scaling 2>&1 | tee evidence/scope-scaling.log
          python -m pytest -q --capture=sys simulation/tests/test_stage_0_5_proof_publication.py --junitxml=evidence/publication-tests.xml 2>&1 | tee evidence/publication-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_publication_scaling.py --output evidence/publication-scaling 2>&1 | tee evidence/publication-scaling.log
          python -m pytest -q --capture=sys simulation/tests/test_stage_0_5_proof_collection.py --junitxml=evidence/collection-tests.xml 2>&1 | tee evidence/collection-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_collection_scaling.py --output evidence/collection-scaling 2>&1 | tee evidence/collection-scaling.log
          python -m pytest -q --capture=sys simulation/tests/test_stage_0_5_proof_collection_publication.py --junitxml=evidence/collection-publication-tests.xml 2>&1 | tee evidence/collection-publication-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_collection_publication_scaling.py --output evidence/collection-publication-scaling 2>&1 | tee evidence/collection-publication-scaling.log
          python -m pytest -q --capture=sys simulation/tests/test_stage_0_5_proof_collection_directory.py --junitxml=evidence/collection-directory-tests.xml 2>&1 | tee evidence/collection-directory-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_collection_directory_scaling.py --output evidence/collection-directory-scaling 2>&1 | tee evidence/collection-directory-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_directory_publication.py --junitxml=evidence/directory-publication-tests.xml 2>&1 | tee evidence/directory-publication-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_directory_publication_scaling.py --output evidence/directory-publication-scaling 2>&1 | tee evidence/directory-publication-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_inventory.py --junitxml=evidence/inventory-tests.xml 2>&1 | tee evidence/inventory-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_inventory_scaling.py --output evidence/inventory-scaling 2>&1 | tee evidence/inventory-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_target.py --junitxml=evidence/target-tests.xml 2>&1 | tee evidence/target-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_target_scaling.py --output evidence/target-scaling 2>&1 | tee evidence/target-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_owner_targets.py --junitxml=evidence/owner-target-tests.xml 2>&1 | tee evidence/owner-target-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_owner_targets_scaling.py --output evidence/owner-target-scaling 2>&1 | tee evidence/owner-target-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_target_group.py simulation/tests/test_stage_0_5_proof_target_group_scaling.py --junitxml=evidence/target-group-tests.xml 2>&1 | tee evidence/target-group-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_target_group_scaling.py --output evidence/target-group-scaling 2>&1 | tee evidence/target-group-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_target_incoming.py --junitxml=evidence/target-incoming-tests.xml 2>&1 | tee evidence/target-incoming-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_target_incoming_scaling.py --output evidence/target-incoming-scaling 2>&1 | tee evidence/target-incoming-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_child_extents.py --junitxml=evidence/child-extents-tests.xml 2>&1 | tee evidence/child-extents-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_child_extents_scaling.py --output evidence/child-extents-scaling 2>&1 | tee evidence/child-extents-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_frozen_extents.py --junitxml=evidence/frozen-extents-tests.xml 2>&1 | tee evidence/frozen-extents-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_frozen_extents_scaling.py --output evidence/frozen-extents-scaling 2>&1 | tee evidence/frozen-extents-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_sequence_event_extents.py --junitxml=evidence/sequence-event-extents-tests.xml 2>&1 | tee evidence/sequence-event-extents-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_sequence_event_extents_scaling.py --output evidence/sequence-event-extents-scaling 2>&1 | tee evidence/sequence-event-extents-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_reference_closure.py --junitxml=evidence/reference-closure-tests.xml 2>&1 | tee evidence/reference-closure-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_reference_closure_scaling.py --output evidence/reference-closure-scaling 2>&1 | tee evidence/reference-closure-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_reference.py --junitxml=evidence/reference-tests.xml 2>&1 | tee evidence/reference-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_reference_scaling.py --output evidence/reference-scaling 2>&1 | tee evidence/reference-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_world_value.py simulation/tests/test_stage_0_5_proof_world_backing_value.py simulation/tests/test_stage_0_5_proof_world_tail.py simulation/tests/test_stage_0_5_proof_world_page_growth.py simulation/tests/test_stage_0_5_proof_world_page_shrink.py --junitxml=evidence/native-value-tests.xml 2>&1 | tee evidence/native-value-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_native_value_scaling.py --output evidence/native-value-scaling 2>&1 | tee evidence/native-value-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_6_proof_world_insert.py simulation/tests/test_stage_0_6_proof_world_mixed.py simulation/tests/test_stage_0_6_proof_world_new_backings.py simulation/tests/test_stage_0_6_proof_world_sequence.py simulation/tests/test_stage_0_6_proof_world_components.py simulation/tests/test_stage_0_6_proof_world_ordinary.py simulation/tests/test_stage_0_6_proof_native_sources.py simulation/tests/test_stage_0_6_proof_native_order.py simulation/tests/test_stage_0_6_proof_native_query.py simulation/tests/test_stage_0_6_proof_native_identity.py simulation/tests/test_stage_0_6_proof_native_roster.py simulation/tests/test_stage_0_6_proof_native_head.py -o junit_family=legacy --junitxml=evidence/native-insert-tests.xml 2>&1 | tee evidence/native-insert-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_native_insert_scaling.py --output evidence/native-insert-scaling 2>&1 | tee evidence/native-insert-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_6_rank_projection.py simulation/tests/test_stage_0_6_proof_native_rank.py --junitxml=evidence/native-rank-tests.xml 2>&1 | tee evidence/native-rank-tests.log
          python -m pytest -q simulation/tests/test_stage_0_6_proof_native_metadata.py -o junit_family=legacy --junitxml=evidence/native-metadata-tests.xml 2>&1 | tee evidence/native-metadata-tests.log
          python -m pytest -q simulation/tests/test_stage_0_6_proof_open.py .github/tests/test_real_year_probe.py -o junit_family=legacy --junitxml=evidence/proof-open-tests.xml 2>&1 | tee evidence/proof-open-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_real_year_probe.py --rank-proofs --proof-only --output evidence/proof-open-year 2>&1 | tee evidence/proof-open-year.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_native_insert_scaling.py --scenario mixed --output evidence/native-mixed-scaling 2>&1 | tee evidence/native-mixed-scaling.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_native_insert_scaling.py --scenario fresh --output evidence/native-fresh-scaling 2>&1 | tee evidence/native-fresh-scaling.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_world_session.py simulation/tests/test_stage_0_6_proof_world_continuation.py --junitxml=evidence/native-world-session-tests.xml 2>&1 | tee evidence/native-world-session-tests.log
          python -m pytest -q simulation/tests/test_stage_0_5_proof_world.py --junitxml=evidence/world-manifest-tests.xml 2>&1 | tee evidence/world-manifest-tests.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_world_manifest_scaling.py --output evidence/world-manifest-scaling 2>&1 | tee evidence/world-manifest-scaling.log
          timeout --signal=TERM --kill-after=30s 15m python .github/tests/run_proof_identity_group_scaling.py --output evidence/group-scaling 2>&1 | tee evidence/group-scaling.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-0-5-proof-map-${{ github.sha }}
          path: |
            evidence/**/*.json
            evidence/**/*.xml
            evidence/*.log
          retention-days: 14
          if-no-files-found: error
  full-suite:
    runs-on: ubuntu-latest
    # The last run passed every reported test but hit the 135m command cap at
    # 96%. Keep the whole suite bounded, with room for current hosted variance.
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Record source and run all simulation tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python - <<'PY'
          import platform, sqlite3, subprocess
          from pathlib import Path
          from simulation import continuation_receipts as r
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          if git('status','--porcelain','--untracked-files=no'):raise ValueError('tracked execution source is dirty')
          r.publish_receipt(Path('evidence/source.json'),dict(head=git('rev-parse','HEAD'),runtime_tree=git('rev-parse','HEAD:simulation/ate_sim'),python=platform.python_version(),sqlite=sqlite3.sqlite_version))
          PY
          timeout --signal=TERM --kill-after=30s 180m python -m pytest -v simulation/tests --durations=30 -o junit_family=legacy --junitxml=evidence/full-suite.xml 2>&1 | tee evidence/full-suite.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-0-5-proof-map-suite-${{ github.sha }}
          path: evidence
          retention-days: 14
          if-no-files-found: error
  mature-genesis:
    needs: [proof-map, full-suite, mature-genesis-request]
    if: ${{ needs.mature-genesis-request.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Validate mature execution boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m pytest -q .github/tests/test_stage_0_6_proof_mature_genesis.py .github/tests/test_stage_0_6_retained_archive.py .github/tests/test_stage_0_6_retained_producer.py .github/tests/test_stage_0_6_retained_transport.py .github/tests/test_stage_0_6_retained_launch.py -o junit_family=legacy --junitxml=evidence/genesis-harness.xml 2>&1 | tee evidence/genesis-harness.log
      - name: Reserve disposable construction disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell
          sudo docker image prune -af
          df -h . > evidence/disk-start.txt
      - name: Convert accepted mature fixture and measure proof continuation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          timeout --signal=TERM --kill-after=30s 330m python -m simulation.stage_0_6_proof_mature_genesis run --root "$GITHUB_WORKSPACE" --config simulation/stage_0_6_proof_genesis_request.json 2>&1 | tee evidence/genesis.log || status=$?
          python -m simulation.stage_0_6_proof_mature_genesis record-exit --root "$GITHUB_WORKSPACE" --status "$status"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-0-6-mature-proof-genesis-${{ github.sha }}
          path: |
            evidence/**/*.json
            evidence/**/*.xml
            evidence/**/*.log
            evidence/disk-start.txt
          retention-days: 30
          if-no-files-found: error
