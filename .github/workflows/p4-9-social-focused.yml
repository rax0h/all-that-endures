name: P4.9 social focused

on:
  push:
    branches:
      - sol-p4-9-social-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python -m pytest -q \
            simulation/tests/test_persistence_lazy_social.py \
            simulation/tests/test_living_partnerships.py
