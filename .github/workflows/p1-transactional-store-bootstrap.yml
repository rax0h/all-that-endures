name: p1-transactional-store-bootstrap
on:
  push:
    branches: [sol/p1-transactional-store]

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: reconstruct checksum-verified P1 candidate
        shell: bash
        run: |
          cat .p1_payload_00 .p1_payload_01 .p1_payload_02 .p1_payload_03 .p1_payload_04 > /tmp/p1.b64
          test "$(sha256sum /tmp/p1.b64 | cut -d' ' -f1)" = "2351acbec1b8c8da69f97d9728c4c794f088ba36732f0c521843c7f1ea99e214"
          base64 -d /tmp/p1.b64 > /tmp/p1.tgz
          test "$(sha256sum /tmp/p1.tgz | cut -d' ' -f1)" = "0c3e5f31869084008b0e692267000976a923bc5d61ee8044d9c06d0f79fee1cd"
          tar -xzf /tmp/p1.tgz
          test "$(sha256sum simulation/ate_sim/incremental_store.py | cut -d' ' -f1)" = "a9dd34908be2b7d4a0bf598bfead0d2bfb6b666e4fe8eb651b322a4e0f40716b"
          test "$(sha256sum simulation/tests/test_incremental_store.py | cut -d' ' -f1)" = "1283b7c0da7c419951fb9663227a29f4a02ae5188431ed2b22ed3e97dd21eb74"
      - name: focused P1 tests
        run: pytest -q simulation/tests/test_incremental_store.py
      - name: full unit suite without millennium
        run: pytest -q simulation/tests
      - name: commit tested P1 candidate
        shell: bash
        run: |
          git config user.name "rax0h"
          git config user.email "youvegotfalcon@gmail.com"
          git add simulation/ate_sim/incremental_store.py simulation/tests/test_incremental_store.py
          git rm .github/workflows/p1-transactional-store-bootstrap.yml .p1_payload_00 .p1_payload_01 .p1_payload_02 .p1_payload_03 .p1_payload_04
          git commit -m "Implement P1 transactional store and typed codec [skip ci]"
          git push origin HEAD:sol/p1-transactional-store
