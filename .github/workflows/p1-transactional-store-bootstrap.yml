name: p1-transactional-store-bootstrap
on:
  push:
    branches: [sol/p1-transactional-store]
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: install P1 candidate
        shell: bash
        run: |
          cat > /tmp/p1.b64 <<'EOF'

EOF
          base64 -d /tmp/p1.b64 > /tmp/p1.tgz
          tar -xzf /tmp/p1.tgz
      - name: focused P1 tests
        run: pytest -q simulation/tests/test_incremental_store.py
      - name: full unit suite without millennium
        run: pytest -q simulation/tests
      - name: commit tested P1 candidate
        shell: bash
        run: |
          git config user.name "rax0h"
          git config user.email "youvegotfalcon@gmail.com"
          git add simulation/ate_sim/incremental_store.py simulation/tests/test_incremental_store.py
          git rm .github/workflows/p1-transactional-store-bootstrap.yml
          git commit -m "Implement P1 transactional store and typed codec [skip ci]"
          git push origin HEAD:sol/p1-transactional-store
