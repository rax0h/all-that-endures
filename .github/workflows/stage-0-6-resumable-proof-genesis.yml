name: Stage 0.6 resumable proof genesis
'on':
  push:
    branches:
    - sol/durable-proof-map
    paths:
    - simulation/stage_0_6_genesis_*.py
    - simulation/stage_0_6_genesis_resume_request.json
    - simulation/stage_0_6_genesis_control_compatibility.json
    - .github/tests/test_stage_0_6_genesis_*.py
    - .github/workflows/stage-0-6-resumable-proof-genesis.yml
    - .github/tests/run_genesis_recovery_drill.py
  workflow_dispatch:
    inputs:
      mode:
        description: Smoke only, or protected mature execution after successful compatible smoke
        type: choice
        options:
        - smoke
        - mature
        default: smoke
      resume_run_id:
        description: Prior compatible workflow run to resume (0 for new)
        type: string
        default: '0'
      smoke_run_id:
        description: Successful compatible hosted smoke run required for mature
        type: string
        default: '0'
permissions:
  contents: read
  actions: read
concurrency:
  group: stage06-resumable-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      resume_index: ${{ steps.decide.outputs.resume_index }}
      artifact_id: ${{ steps.decide.outputs.resume_artifact_id || steps.metadata.outputs.artifact-id }}
      run_id: ${{ steps.decide.outputs.resume_run_id || github.run_id }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12.16
    - run: python -m pip install pytest==9.2.0 pyyaml==6.0.3
    - name: Verify only new harness and affected transport boundaries
      shell: bash
      run: 'set -euo pipefail

        mkdir -p resume-tests

        python -m pytest -q .github/tests/test_stage_0_6_genesis_*.py .github/tests/test_stage_0_6_retained_*.py .github/tests/test_stage_0_6_proof_mature_genesis.py
        --junitxml=resume-tests/harness.xml 2>&1 | tee resume-tests/harness.log

        '
    - id: decide
      name: Authenticate green code and choose exact restart point
      env:
        BEFORE: ${{ github.event.before }}
        INPUT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || '' }}
        INPUT_RESUME: ${{ inputs.resume_run_id || '0' }}
        INPUT_SMOKE: ${{ inputs.smoke_run_id || '0' }}
      run: python -m simulation.stage_0_6_genesis_resume gate --mode "$INPUT_MODE" --resume-run "$INPUT_RESUME" --smoke-run "$INPUT_SMOKE"
    - id: data
      uses: actions/upload-artifact@v4
      timeout-minutes: 45
      with:
        name: database-${{ steps.decide.outputs.mode }}-source-${{ github.sha }}-${{ github.run_attempt }}
        path: resume-work/out/candidate.sqlite
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: steps.decide.outputs.has_database == 'true'
      name: Publish closed checkpoint database
    - id: seal
      if: steps.decide.outputs.fresh == 'true'
      env:
        DATA_ID: ${{ steps.data.outputs.artifact-id || '0' }}
      run: python -m simulation.stage_0_6_genesis_resume seal --artifact-id "$DATA_ID"
      name: Seal checkpoint provenance
    - id: metadata
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: ${{ steps.seal.outputs.metadata_name }}
        path: resume-work/out/checkpoint.json
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: steps.decide.outputs.fresh == 'true'
      name: Publish sealed checkpoint metadata
    - id: evidence
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: resume-evidence-gate-${{ github.sha }}-${{ github.run_attempt }}
        path: 'resume-tests/**

          resume-work/*.json'
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: always()
      continue-on-error: true
  source-digest:
    needs:
    - gate
    if: ${{ always() && needs.gate.result == 'success' && fromJSON(needs.gate.outputs.resume_index) < 0 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact_id: ${{ steps.metadata.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12.16
    - run: python -m pip install pytest==9.2.0 pyyaml==6.0.3
    - name: Reserve disposable stage disk before restore
      shell: bash
      run: 'set -euo pipefail

        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell

        sudo docker image prune -af

        df -h .

        '
      if: needs.gate.outputs.mode == 'mature'
    - id: run
      name: Restore verified predecessor and execute only this stage
      env:
        MODE: ${{ needs.gate.outputs.mode }}
        PARENT_ID: ${{ needs.gate.outputs.artifact_id || needs.gate.outputs.artifact_id }}
        PARENT_RUN: ${{ needs.gate.outputs.run_id }}
      run: python -m simulation.stage_0_6_genesis_resume run-stage --stage source_digest --mode "$MODE" --parent-artifact "$PARENT_ID" --parent-run
        "$PARENT_RUN"
    - id: data
      uses: actions/upload-artifact@v4
      timeout-minutes: 45
      with:
        name: database-${{ needs.gate.outputs.mode }}-source_digest-${{ github.sha }}-${{ github.run_attempt }}
        path: resume-work/out/candidate.sqlite
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: steps.run.outputs.has_database == 'true'
      name: Publish closed checkpoint database
    - id: seal
      env:
        DATA_ID: ${{ steps.data.outputs.artifact-id || '0' }}
      run: python -m simulation.stage_0_6_genesis_resume seal --artifact-id "$DATA_ID"
      name: Seal checkpoint provenance
    - id: metadata
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: ${{ steps.seal.outputs.metadata_name }}
        path: resume-work/out/checkpoint.json
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      name: Publish sealed checkpoint metadata
    - id: evidence
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: resume-evidence-${{ needs.gate.outputs.mode }}-source_digest-${{ github.sha }}-${{ github.run_attempt }}
        path: 'resume-work/*.json

          resume-work/evidence-*/**/*.json

          resume-work/transport/**/*.json'
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: always()
      continue-on-error: true
  capture:
    needs:
    - gate
    - source-digest
    if: ${{ always() && needs.gate.result == 'success' && needs.source-digest.result != 'failure' && needs.source-digest.result != 'cancelled'
      && (needs.source-digest.result == 'success' || fromJSON(needs.gate.outputs.resume_index) == 0) && fromJSON(needs.gate.outputs.resume_index)
      < 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      artifact_id: ${{ steps.metadata.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12.16
    - run: python -m pip install pytest==9.2.0 pyyaml==6.0.3
    - name: Reserve disposable stage disk before restore
      shell: bash
      run: 'set -euo pipefail

        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell

        sudo docker image prune -af

        df -h .

        '
      if: needs.gate.outputs.mode == 'mature'
    - id: run
      name: Restore verified predecessor and execute only this stage
      env:
        MODE: ${{ needs.gate.outputs.mode }}
        PARENT_ID: ${{ needs.source-digest.outputs.artifact_id || needs.gate.outputs.artifact_id }}
        PARENT_RUN: ${{ needs.source-digest.outputs.artifact_id && github.run_id || needs.gate.outputs.run_id }}
      run: python -m simulation.stage_0_6_genesis_resume run-stage --stage capture --mode "$MODE" --parent-artifact "$PARENT_ID" --parent-run
        "$PARENT_RUN"
    - id: data
      uses: actions/upload-artifact@v4
      timeout-minutes: 45
      with:
        name: database-${{ needs.gate.outputs.mode }}-capture-${{ github.sha }}-${{ github.run_attempt }}
        path: resume-work/out/candidate.sqlite
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: steps.run.outputs.has_database == 'true'
      name: Publish closed checkpoint database
    - id: seal
      env:
        DATA_ID: ${{ steps.data.outputs.artifact-id || '0' }}
      run: python -m simulation.stage_0_6_genesis_resume seal --artifact-id "$DATA_ID"
      name: Seal checkpoint provenance
    - id: metadata
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: ${{ steps.seal.outputs.metadata_name }}
        path: resume-work/out/checkpoint.json
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      name: Publish sealed checkpoint metadata
    - id: evidence
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: resume-evidence-${{ needs.gate.outputs.mode }}-capture-${{ github.sha }}-${{ github.run_attempt }}
        path: 'resume-work/*.json

          resume-work/evidence-*/**/*.json

          resume-work/transport/**/*.json'
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: always()
      continue-on-error: true
  catalog:
    needs:
    - gate
    - capture
    if: ${{ always() && needs.gate.result == 'success' && needs.capture.result != 'failure' && needs.capture.result != 'cancelled' && (needs.capture.result
      == 'success' || fromJSON(needs.gate.outputs.resume_index) == 1) && fromJSON(needs.gate.outputs.resume_index) < 2 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      artifact_id: ${{ steps.metadata.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12.16
    - run: python -m pip install pytest==9.2.0 pyyaml==6.0.3
    - name: Reserve disposable stage disk before restore
      shell: bash
      run: 'set -euo pipefail

        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell

        sudo docker image prune -af

        df -h .

        '
      if: needs.gate.outputs.mode == 'mature'
    - id: run
      name: Restore verified predecessor and execute only this stage
      env:
        MODE: ${{ needs.gate.outputs.mode }}
        PARENT_ID: ${{ needs.capture.outputs.artifact_id || needs.gate.outputs.artifact_id }}
        PARENT_RUN: ${{ needs.capture.outputs.artifact_id && github.run_id || needs.gate.outputs.run_id }}
      run: python -m simulation.stage_0_6_genesis_resume run-stage --stage catalog --mode "$MODE" --parent-artifact "$PARENT_ID" --parent-run
        "$PARENT_RUN"
    - id: data
      uses: actions/upload-artifact@v4
      timeout-minutes: 45
      with:
        name: database-${{ needs.gate.outputs.mode }}-catalog-${{ github.sha }}-${{ github.run_attempt }}
        path: resume-work/out/candidate.sqlite
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: steps.run.outputs.has_database == 'true'
      name: Publish closed checkpoint database
    - id: seal
      env:
        DATA_ID: ${{ steps.data.outputs.artifact-id || '0' }}
      run: python -m simulation.stage_0_6_genesis_resume seal --artifact-id "$DATA_ID"
      name: Seal checkpoint provenance
    - id: metadata
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: ${{ steps.seal.outputs.metadata_name }}
        path: resume-work/out/checkpoint.json
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      name: Publish sealed checkpoint metadata
    - id: evidence
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: resume-evidence-${{ needs.gate.outputs.mode }}-catalog-${{ github.sha }}-${{ github.run_attempt }}
        path: 'resume-work/*.json

          resume-work/evidence-*/**/*.json

          resume-work/transport/**/*.json'
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: always()
      continue-on-error: true
  rebase:
    needs:
    - gate
    - catalog
    if: ${{ always() && needs.gate.result == 'success' && needs.catalog.result != 'failure' && needs.catalog.result != 'cancelled' && (needs.catalog.result
      == 'success' || fromJSON(needs.gate.outputs.resume_index) == 2) && fromJSON(needs.gate.outputs.resume_index) < 3 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      artifact_id: ${{ steps.metadata.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12.16
    - run: python -m pip install pytest==9.2.0 pyyaml==6.0.3
    - name: Reserve disposable stage disk before restore
      shell: bash
      run: 'set -euo pipefail

        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell

        sudo docker image prune -af

        df -h .

        '
      if: needs.gate.outputs.mode == 'mature'
    - id: recovery-drill
      name: Crash a small worker and retain its verified parent
      env:
        MODE: ${{ needs.gate.outputs.mode }}
        PARENT_ID: ${{ needs.catalog.outputs.artifact_id || needs.gate.outputs.artifact_id }}
        PARENT_RUN: ${{ needs.catalog.outputs.artifact_id && github.run_id || needs.gate.outputs.run_id }}
      run: python .github/tests/run_genesis_recovery_drill.py
      if: needs.gate.outputs.mode == 'smoke'
      timeout-minutes: 5
    - id: run
      name: Restore verified predecessor and execute only this stage
      env:
        MODE: ${{ needs.gate.outputs.mode }}
        PARENT_ID: ${{ needs.catalog.outputs.artifact_id || needs.gate.outputs.artifact_id }}
        PARENT_RUN: ${{ needs.catalog.outputs.artifact_id && github.run_id || needs.gate.outputs.run_id }}
      run: python -m simulation.stage_0_6_genesis_resume run-stage --stage rebase --mode "$MODE" --parent-artifact "$PARENT_ID" --parent-run "$PARENT_RUN"
    - id: data
      uses: actions/upload-artifact@v4
      timeout-minutes: 45
      with:
        name: database-${{ needs.gate.outputs.mode }}-rebase-${{ github.sha }}-${{ github.run_attempt }}
        path: resume-work/out/candidate.sqlite
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: steps.run.outputs.has_database == 'true'
      name: Publish closed checkpoint database
    - id: seal
      env:
        DATA_ID: ${{ steps.data.outputs.artifact-id || '0' }}
      run: python -m simulation.stage_0_6_genesis_resume seal --artifact-id "$DATA_ID"
      name: Seal checkpoint provenance
    - id: metadata
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: ${{ steps.seal.outputs.metadata_name }}
        path: resume-work/out/checkpoint.json
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      name: Publish sealed checkpoint metadata
    - id: evidence
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: resume-evidence-${{ needs.gate.outputs.mode }}-rebase-${{ github.sha }}-${{ github.run_attempt }}
        path: 'resume-work/*.json

          resume-work/evidence-*/**/*.json

          resume-work/transport/**/*.json

          recovery-work/*.json

          recovery-work/*.log

          recovery-work/evidence-*/**/*.json'
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: always()
      continue-on-error: true
  after-digest:
    needs:
    - gate
    - rebase
    if: ${{ always() && needs.gate.result == 'success' && needs.rebase.result != 'failure' && needs.rebase.result != 'cancelled' && (needs.rebase.result
      == 'success' || fromJSON(needs.gate.outputs.resume_index) == 3) && fromJSON(needs.gate.outputs.resume_index) < 4 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.metadata.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12.16
    - run: python -m pip install pytest==9.2.0 pyyaml==6.0.3
    - name: Reserve disposable stage disk before restore
      shell: bash
      run: 'set -euo pipefail

        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell

        sudo docker image prune -af

        df -h .

        '
      if: needs.gate.outputs.mode == 'mature'
    - id: run
      name: Restore verified predecessor and execute only this stage
      env:
        MODE: ${{ needs.gate.outputs.mode }}
        PARENT_ID: ${{ needs.rebase.outputs.artifact_id || needs.gate.outputs.artifact_id }}
        PARENT_RUN: ${{ needs.rebase.outputs.artifact_id && github.run_id || needs.gate.outputs.run_id }}
      run: python -m simulation.stage_0_6_genesis_resume run-stage --stage after_digest --mode "$MODE" --parent-artifact "$PARENT_ID" --parent-run
        "$PARENT_RUN"
    - id: data
      uses: actions/upload-artifact@v4
      timeout-minutes: 45
      with:
        name: database-${{ needs.gate.outputs.mode }}-after_digest-${{ github.sha }}-${{ github.run_attempt }}
        path: resume-work/out/candidate.sqlite
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: steps.run.outputs.has_database == 'true'
      name: Publish closed checkpoint database
    - id: seal
      env:
        DATA_ID: ${{ steps.data.outputs.artifact-id || '0' }}
      run: python -m simulation.stage_0_6_genesis_resume seal --artifact-id "$DATA_ID"
      name: Seal checkpoint provenance
    - id: metadata
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: ${{ steps.seal.outputs.metadata_name }}
        path: resume-work/out/checkpoint.json
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      name: Publish sealed checkpoint metadata
    - id: evidence
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: resume-evidence-${{ needs.gate.outputs.mode }}-after_digest-${{ github.sha }}-${{ github.run_attempt }}
        path: 'resume-work/*.json

          resume-work/evidence-*/**/*.json

          resume-work/transport/**/*.json'
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: always()
      continue-on-error: true
  proofs:
    needs:
    - gate
    - after-digest
    if: ${{ always() && needs.gate.result == 'success' && needs.after-digest.result != 'failure' && needs.after-digest.result != 'cancelled' &&
      (needs.after-digest.result == 'success' || fromJSON(needs.gate.outputs.resume_index) == 4) && fromJSON(needs.gate.outputs.resume_index)
      < 5 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      artifact_id: ${{ steps.metadata.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12.16
    - run: python -m pip install pytest==9.2.0 pyyaml==6.0.3
    - name: Reserve disposable stage disk before restore
      shell: bash
      run: 'set -euo pipefail

        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell

        sudo docker image prune -af

        df -h .

        '
      if: needs.gate.outputs.mode == 'mature'
    - id: run
      name: Restore verified predecessor and execute only this stage
      env:
        MODE: ${{ needs.gate.outputs.mode }}
        PARENT_ID: ${{ needs.after-digest.outputs.artifact_id || needs.gate.outputs.artifact_id }}
        PARENT_RUN: ${{ needs.after-digest.outputs.artifact_id && github.run_id || needs.gate.outputs.run_id }}
      run: python -m simulation.stage_0_6_genesis_resume run-stage --stage proofs --mode "$MODE" --parent-artifact "$PARENT_ID" --parent-run "$PARENT_RUN"
    - id: data
      uses: actions/upload-artifact@v4
      timeout-minutes: 45
      with:
        name: database-${{ needs.gate.outputs.mode }}-proofs-${{ github.sha }}-${{ github.run_attempt }}
        path: resume-work/out/candidate.sqlite
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: steps.run.outputs.has_database == 'true'
      name: Publish closed checkpoint database
    - id: seal
      env:
        DATA_ID: ${{ steps.data.outputs.artifact-id || '0' }}
      run: python -m simulation.stage_0_6_genesis_resume seal --artifact-id "$DATA_ID"
      name: Seal checkpoint provenance
    - id: metadata
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: ${{ steps.seal.outputs.metadata_name }}
        path: resume-work/out/checkpoint.json
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      name: Publish sealed checkpoint metadata
    - id: evidence
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: resume-evidence-${{ needs.gate.outputs.mode }}-proofs-${{ github.sha }}-${{ github.run_attempt }}
        path: 'resume-work/*.json

          resume-work/evidence-*/**/*.json

          resume-work/transport/**/*.json'
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: always()
      continue-on-error: true
  measure:
    needs:
    - gate
    - proofs
    if: ${{ always() && needs.gate.result == 'success' && needs.proofs.result != 'failure' && needs.proofs.result != 'cancelled' && (needs.proofs.result
      == 'success' || fromJSON(needs.gate.outputs.resume_index) == 5) && fromJSON(needs.gate.outputs.resume_index) < 6 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      artifact_id: ${{ steps.metadata.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12.16
    - run: python -m pip install pytest==9.2.0 pyyaml==6.0.3
    - name: Reserve disposable stage disk before restore
      shell: bash
      run: 'set -euo pipefail

        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell

        sudo docker image prune -af

        df -h .

        '
      if: needs.gate.outputs.mode == 'mature'
    - id: run
      name: Restore verified predecessor and execute only this stage
      env:
        MODE: ${{ needs.gate.outputs.mode }}
        PARENT_ID: ${{ needs.proofs.outputs.artifact_id || needs.gate.outputs.artifact_id }}
        PARENT_RUN: ${{ needs.proofs.outputs.artifact_id && github.run_id || needs.gate.outputs.run_id }}
      run: python -m simulation.stage_0_6_genesis_resume run-stage --stage measure --mode "$MODE" --parent-artifact "$PARENT_ID" --parent-run
        "$PARENT_RUN"
    - id: data
      uses: actions/upload-artifact@v4
      timeout-minutes: 45
      with:
        name: database-${{ needs.gate.outputs.mode }}-measure-${{ github.sha }}-${{ github.run_attempt }}
        path: resume-work/out/candidate.sqlite
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: steps.run.outputs.has_database == 'true'
      name: Publish closed checkpoint database
    - id: seal
      env:
        DATA_ID: ${{ steps.data.outputs.artifact-id || '0' }}
      run: python -m simulation.stage_0_6_genesis_resume seal --artifact-id "$DATA_ID"
      name: Seal checkpoint provenance
    - id: metadata
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: ${{ steps.seal.outputs.metadata_name }}
        path: resume-work/out/checkpoint.json
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      name: Publish sealed checkpoint metadata
    - id: evidence
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: resume-evidence-${{ needs.gate.outputs.mode }}-measure-${{ github.sha }}-${{ github.run_attempt }}
        path: 'resume-work/*.json

          resume-work/evidence-*/**/*.json

          resume-work/transport/**/*.json'
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: always()
      continue-on-error: true
  fresh-restore:
    needs:
    - gate
    - measure
    if: ${{ always() && needs.gate.result == 'success' && needs.measure.result != 'failure' && needs.measure.result != 'cancelled' && (needs.measure.result
      == 'success' || fromJSON(needs.gate.outputs.resume_index) == 6) && fromJSON(needs.gate.outputs.resume_index) < 7 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.metadata.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12.16
    - run: python -m pip install pytest==9.2.0 pyyaml==6.0.3
    - name: Check measured targets before another large restore/digest
      env:
        MODE: ${{ needs.gate.outputs.mode }}
        PARENT_ID: ${{ needs.measure.outputs.artifact_id || needs.gate.outputs.artifact_id }}
        PARENT_RUN: ${{ needs.measure.outputs.artifact_id && github.run_id || needs.gate.outputs.run_id }}
      run: python -m simulation.stage_0_6_genesis_resume check-targets --mode "$MODE" --parent-artifact "$PARENT_ID" --parent-run "$PARENT_RUN"
    - name: Reserve disposable stage disk before restore
      shell: bash
      run: 'set -euo pipefail

        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell

        sudo docker image prune -af

        df -h .

        '
      if: needs.gate.outputs.mode == 'mature'
    - id: run
      name: Restore verified predecessor and execute only this stage
      env:
        MODE: ${{ needs.gate.outputs.mode }}
        PARENT_ID: ${{ needs.measure.outputs.artifact_id || needs.gate.outputs.artifact_id }}
        PARENT_RUN: ${{ needs.measure.outputs.artifact_id && github.run_id || needs.gate.outputs.run_id }}
      run: python -m simulation.stage_0_6_genesis_resume run-stage --stage fresh_restore --mode "$MODE" --parent-artifact "$PARENT_ID" --parent-run
        "$PARENT_RUN"
    - id: data
      uses: actions/upload-artifact@v4
      timeout-minutes: 45
      with:
        name: database-${{ needs.gate.outputs.mode }}-fresh_restore-${{ github.sha }}-${{ github.run_attempt }}
        path: resume-work/out/candidate.sqlite
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: steps.run.outputs.has_database == 'true'
      name: Publish closed checkpoint database
    - id: seal
      env:
        DATA_ID: ${{ steps.data.outputs.artifact-id || '0' }}
      run: python -m simulation.stage_0_6_genesis_resume seal --artifact-id "$DATA_ID"
      name: Seal checkpoint provenance
    - id: metadata
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: ${{ steps.seal.outputs.metadata_name }}
        path: resume-work/out/checkpoint.json
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      name: Publish sealed checkpoint metadata
    - id: evidence
      uses: actions/upload-artifact@v4
      timeout-minutes: 5
      with:
        name: resume-evidence-${{ needs.gate.outputs.mode }}-fresh_restore-${{ github.sha }}-${{ github.run_attempt }}
        path: 'resume-work/*.json

          resume-work/evidence-*/**/*.json

          resume-work/transport/**/*.json'
        retention-days: 30
        if-no-files-found: error
        compression-level: 1
      if: always()
      continue-on-error: true
  acceptance:
    needs:
    - gate
    - fresh-restore
    if: ${{ always() && needs.gate.result == 'success' && (needs.fresh-restore.result == 'success' || fromJSON(needs.gate.outputs.resume_index)
      == 7) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12.16
    - run: python -m pip install pytest==9.2.0 pyyaml==6.0.3
    - name: Accept exact fresh continuation and mature targets where applicable
      env:
        MODE: ${{ needs.gate.outputs.mode }}
        PARENT_ID: ${{ needs.fresh-restore.outputs.artifact_id || needs.gate.outputs.artifact_id }}
        PARENT_RUN: ${{ needs.fresh-restore.outputs.artifact_id && github.run_id || needs.gate.outputs.run_id }}
      run: python -m simulation.stage_0_6_genesis_resume accept --mode "$MODE" --parent-artifact "$PARENT_ID" --parent-run "$PARENT_RUN"
