name: Stage 0.5 final source and long horizon
on:
  push:
    branches: [sol/stage-0-5-final-release-validation]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
jobs:
  recovery-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bdde5bc20c40583045fcb3562698847db460b080
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Regressions and complete 3+4+3 recovery
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD HEAD^{tree} 2>&1 | tee evidence/source.txt
          python -m pytest -q -o junit_family=legacy --junitxml=evidence/focused.xml simulation/tests/test_persistence_lazy_identity.py simulation/tests/test_stage_0_5_owner_witness_cache.py simulation/tests/test_stage_0_5_final_long_harness.py 2>&1 | tee evidence/focused.log
          timeout 35m python simulation/persistence_p5_validation.py --seed 843000 --pre-years 3 --continuation-years 4 --reopen-years 3 --complete-format --rules-id stage-0-5-final-release --workdir evidence/p5 --output evidence/p5.json 2>&1 | tee evidence/p5.log
          python - <<'PY'
          import json
          r=json.load(open('evidence/p5.json'))
          assert r['passed'] and r['complete_format'] and r['final_year']==10
          assert r['control_final_digest']=='3301d4e4a6a2f415679cabe62754813440034cf4c190035c79ba82cc7b8e378e'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-source-recovery-evidence
          path: |
            evidence/*.txt
            evidence/*.json
            evidence/*.xml
            evidence/*.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: final-source-short-restore
          path: evidence/p5/p5-relocated.sqlite
          retention-days: 14
  full-suite:
    needs: recovery-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bdde5bc20c40583045fcb3562698847db460b080
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD HEAD^{tree} 2>&1 | tee evidence/source.txt
          python -m pytest -q -o junit_family=legacy --durations=30 --junitxml=evidence/full.xml simulation/tests 2>&1 | tee evidence/full.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-source-full-suite
          path: evidence
          retention-days: 14
  canonical-millennium:
    needs: recovery-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bdde5bc20c40583045fcb3562698847db460b080
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical thousand years and chronological archive audit
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD HEAD^{tree} 2>&1 | tee evidence/source.txt
          timeout 100m python simulation/run_long_history.py 843000 1000 --archive evidence/canonical.sqlite 2>&1 | tee evidence/canonical.jsonl
          python simulation/validate_magic_progression.py evidence/canonical.sqlite 2>&1 | tee evidence/canonical-audit.json
          python - <<'PY'
          import hashlib,json
          rows=[json.loads(s) for s in open('evidence/canonical.jsonl')]
          b=next(r for r in rows if r.get('record')=='benchmark')
          assert b['seed']==843000 and b['years']==1000 and b['initialization']=='mature'
          assert json.load(open('evidence/canonical-audit.json'))['valid']
          print('::warning::120-second optimization goal exceeded' if b['simulation_seconds']>120 else '120-second optimization goal met')
          with open('evidence/canonical.sqlite','rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          json.dump({'sha256':digest,'benchmark':b},open('evidence/canonical-receipt.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-source-canonical-evidence
          path: |
            evidence/*.txt
            evidence/*.json
            evidence/*.jsonl
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: final-source-canonical-archive
          path: evidence/canonical.sqlite
          retention-days: 14
          compression-level: 1
  complete-late-fixture:
    needs: [recovery-gate, full-suite, canonical-millennium]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bdde5bc20c40583045fcb3562698847db460b080
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: final-source-canonical-evidence
          path: canonical-evidence
      - name: Reserve hosted-runner disk for disposable conversion databases
        shell: bash
        run: |
          # Only unused preinstalled toolchains on this disposable hosted runner.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          mkdir -p evidence
          df -h . 2>&1 | tee evidence/disk-start.txt
          python -c "import shutil; assert shutil.disk_usage('.').free > 25*1024**3, 'need 25 GiB for explicit conversion and restore copies'"
      - name: Complete format year1000 to1001 to1002 with independent control
        shell: bash
        run: |
          git rev-parse HEAD HEAD^{tree} 2>&1 | tee evidence/source.txt
          timeout --signal=TERM --kill-after=30s 350m python simulation/persistence_p5_long_validation.py --seed 843000 --initialization mature --bootstrap-year 1000 --milestones 1001 1002 --complete-format --rules-id stage-0-5-final-release --workdir evidence/late --output evidence/late.json --product-sha bdde5bc20c40583045fcb3562698847db460b080 --workflow-sha '${{ github.sha }}' 2>&1 | tee evidence/late.log
          python - <<'PY'
          import json,hashlib
          r=json.load(open('evidence/late.json'))
          c=json.load(open('canonical-evidence/canonical-receipt.json'))
          assert r['passed'] and r['complete_format'] and r['initialization']=='mature'
          assert r['bootstrap_digest']==c['benchmark']['digest']
          assert r['product_sha']=='bdde5bc20c40583045fcb3562698847db460b080' and r['milestones']==[1001,1002]
          assert all(r['p4'][str(y)]['matches_control'] for y in (1001,1002))
          assert r['restore_artifact']['year']==1002
          with open(r['restore_artifact']['path'],'rb') as f:
              assert hashlib.file_digest(f,'sha256').hexdigest()==r['restore_artifact']['sha256']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-source-late-evidence
          path: |
            evidence/*.txt
            evidence/*.json
            evidence/*.log
            evidence/late/progress.jsonl
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: final-source-year1002-restore
          path: evidence/late/p5-long-restore.sqlite
          retention-days: 14
          compression-level: 1
  downloaded-restore-proof:
    needs: complete-late-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bdde5bc20c40583045fcb3562698847db460b080
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reserve hosted-runner space for retained and operational copies
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/download-artifact@v4
        with:
          name: final-source-late-evidence
          path: downloaded-evidence
      - uses: actions/download-artifact@v4
        with:
          name: final-source-year1002-restore
          path: retained
      - name: Verify downloaded original and reopen disposable copy
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD HEAD^{tree} 2>&1 | tee evidence/source.txt
          python - <<'PY' 2>&1 | tee evidence/restore.log
          import hashlib,json,pathlib,shutil,os
          from ate_sim.persistence_lazy import open_lazy_world_session
          from persistence_p5_long_validation import _counters
          r=json.load(open('downloaded-evidence/late.json'))
          source=pathlib.Path('retained/p5-long-restore.sqlite')
          def sha(path):
              with path.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          expected=r['restore_artifact']
          assert r['product_sha']=='bdde5bc20c40583045fcb3562698847db460b080' and r['passed'] and r['complete_format']
          assert sha(source)==expected['sha256']
          assert shutil.disk_usage('.').free > source.stat().st_size+1024**3
          copy=pathlib.Path('operational.sqlite');shutil.copyfile(source,copy)
          with open_lazy_world_session(copy,rules_id=r['rules_id']) as s:
              assert s.world.year==expected['year']==1002
              assert s.pin.captured_head==expected['generation']
              assert int(s.store.db.execute("SELECT value FROM store_metadata WHERE key='format_version'").fetchone()[0])==6
              digest=s.world.digest()
              assert digest==expected['digest']==r['control']['1002']['digest']
              assert _counters(s.world)==r['control']['1002']['counters']
          assert sha(source)==expected['sha256']
          result={'passed':True,'candidate':'bdde5bc20c40583045fcb3562698847db460b080','workflow_sha':os.environ['GITHUB_SHA'],'year':1002,'digest':digest,'downloaded_sha256':expected['sha256'],'retained_original_unchanged':True}
          json.dump(result,open('evidence/downloaded-restore.json','w'),indent=2)
          print(json.dumps(result),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-source-downloaded-restore-proof
          path: evidence
          retention-days: 14
