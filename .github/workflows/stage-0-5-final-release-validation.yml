name: Stage 0.5 complete upgrade memory diagnosis
'on':
  push:
    branches:
    - sol/stage-0-5-final-release-validation
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
jobs:
  complete-memory-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ccba8cc6eba70965271d2570043829b3368e695a
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reserve hosted-runner disk for disposable conversion databases
      shell: bash
      run: |
        # Only unused preinstalled toolchains on this disposable hosted runner.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        mkdir -p evidence
        df -h . 2>&1 | tee evidence/disk-start.txt
        python -c "import shutil; assert shutil.disk_usage('.').free > 25*1024**3, 'need 25 GiB for explicit conversion and restore copies'"
    - uses: actions/download-artifact@v4
      with:
        name: late-lazy-checkpoint
        path: evidence/late
        run-id: 38508408370
        github-token: ${{ github.token }}
    - name: Verify reused lazy checkpoint provenance
      shell: bash
      run: |
        python - <<'CHECK'
        import json
        r=json.load(open('evidence/late/checkpoint.json'))
        assert r['stage']=='lazy' and r['workflow_sha']=='124c3215468a60862b7848086f00a8e768a6ed66'
        assert r['config']['product_sha']=='2bc3c85389760ff12578857f7d2a849bc5cf9201'
        CHECK
    - name: Locate complete-upgrade memory growth from retained lazy checkpoint
      shell: bash
      run: |
        mkdir -p evidence
        git rev-parse HEAD HEAD^{tree} HEAD:simulation/ate_sim | tee evidence/source.txt
        (
          while true; do
            date -u
            free -m
            df -h .
            ps -eo pid,ppid,rss,vsz,comm --sort=-rss | head -n 10 || true
            for f in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
              if [ -r "$f" ]; then echo "$f"; cat "$f"; fi
            done
            sleep 60
          done
        ) > >(tee evidence/resources.log) 2>&1 &
        monitor_pid=$!
        trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
        timeout --signal=TERM --kill-after=30s 80m python - --seed 843000 --initialization mature --bootstrap-year 1000 --milestones 1001 1002 --complete-format --rules-id stage-0-5-final-release --workdir evidence/late --output evidence/late.json --product-sha 2bc3c85389760ff12578857f7d2a849bc5cf9201 --workflow-sha '${{ github.sha }}' --stop-after complete --resume-from lazy <<'PROBE' 2>&1 | tee evidence/late.log
        import functools,json,resource,runpy,time
        from ate_sim import persistence_catalog_copy as copy
        from ate_sim import persistence_event_copy_normalization as normalization
        # Limit only this Python process; leave room for the runner and artifact upload.
        resource.setrlimit(resource.RLIMIT_AS,(8*1024**3,8*1024**3))
        def observe(module,name):
            original=getattr(module,name)
            @functools.wraps(original)
            def wrapped(*args,**kwargs):
                started=time.monotonic()
                print(json.dumps({'probe':name,'phase':'started','peak_rss_kib':resource.getrusage(resource.RUSAGE_SELF).ru_maxrss}),flush=True)
                try:
                    result=original(*args,**kwargs)
                except BaseException as error:
                    print(json.dumps({'probe':name,'phase':'failed','exception':type(error).__name__,'peak_rss_kib':resource.getrusage(resource.RUSAGE_SELF).ru_maxrss}),flush=True)
                    raise
                print(json.dumps({'probe':name,'phase':'finished','seconds':time.monotonic()-started,'peak_rss_kib':resource.getrusage(resource.RUSAGE_SELF).ru_maxrss}),flush=True)
                return result
            setattr(module,name,wrapped)
        for name in ('_owner_sources','initial_catalog_delta','_backing_rosters','_check_reference_targets','_check_backing_graph','_empty_destination','_verify_catalog'):
            observe(copy,name)
        for name in ('capture_bodies','normalize_events'):
            observe(normalization,name)
        print('DIAGNOSTIC RUN: 8 GiB address-space cap; this is not final release acceptance',flush=True)
        runpy.run_module('persistence_p5_long_validation',run_name='__main__')
        PROBE
    - name: Capture native failure diagnostics
      if: failure()
      shell: bash
      run: |
        mkdir -p evidence
        { python -VV; python -c 'import sqlite3; print(sqlite3.sqlite_version)'; sudo dmesg --ctime | tail -n 80; coredumpctl info --no-pager; } > evidence/native-failure.log 2>&1 || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: memory-probe-late-complete-diagnostics
        path: |-
          evidence/*.txt
          evidence/*.json
          evidence/*.log
          evidence/late/progress.jsonl
        retention-days: 14
        compression-level: 1
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: memory-probe-late-complete-checkpoint
        path: |-
          evidence/late/checkpoint.json
          evidence/late/p5-long-complete.sqlite
        retention-days: 14
        compression-level: 1
        if-no-files-found: error
