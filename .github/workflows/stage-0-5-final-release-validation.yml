        PY
    - name: Capture native failure diagnostics
      if: failure()
      shell: bash
      run: |
        mkdir -p evidence
        { python -VV; python -c 'import sqlite3; print(sqlite3.sqlite_version)'; sudo dmesg --ctime | tail -n 80; coredumpctl info --no-pager; } > evidence/native-failure.log 2>&1 || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: final-source-late-evidence
        path: |
          evidence/*.txt
          evidence/*.json
          evidence/*.log
          evidence/late/progress.jsonl
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: final-source-year1002-restore
        path: evidence/late/p5-long-restore.sqlite
        retention-days: 14
        compression-level: 1
  downloaded-restore-proof:
    needs: complete-late-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.CANDIDATE_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reserve hosted-runner space for retained and operational copies
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
    - uses: actions/download-artifact@v4
      with:
        name: final-source-late-evidence
        path: downloaded-evidence
    - uses: actions/download-artifact@v4
      with:
        name: final-source-year1002-restore
        path: retained
    - name: Verify downloaded original and reopen disposable copy
      shell: bash
      run: |
        mkdir -p evidence
        git rev-parse HEAD HEAD^{tree} 2>&1 | tee evidence/source.txt
        python - <<'PY' 2>&1 | tee evidence/restore.log
        import hashlib,json,pathlib,shutil,os
        from ate_sim.persistence_lazy import open_lazy_world_session
        from persistence_p5_long_validation import _counters
        r=json.load(open('downloaded-evidence/late.json'))
        source=pathlib.Path('retained/p5-long-restore.sqlite')
        def sha(path):
            with path.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
        expected=r['restore_artifact']
        assert r['product_sha']==os.environ['CANDIDATE_SHA'] and r['passed'] and r['complete_format']
        assert sha(source)==expected['sha256']
        assert shutil.disk_usage('.').free > source.stat().st_size+1024**3
        copy=pathlib.Path('operational.sqlite');shutil.copyfile(source,copy)
        with open_lazy_world_session(copy,rules_id=r['rules_id']) as s:
            assert s.world.year==expected['year']==1002
            assert s.pin.captured_head==expected['generation']
            assert int(s.store.db.execute("SELECT value FROM store_metadata WHERE key='format_version'").fetchone()[0])==6
            digest=s.world.digest()
            assert digest==expected['digest']==r['control']['1002']['digest']
            assert _counters(s.world)==r['control']['1002']['counters']
        assert sha(source)==expected['sha256']
        result={'passed':True,'candidate':os.environ['CANDIDATE_SHA'],'source_checkpoint':r['source_checkpoint'],'workflow_sha':os.environ['GITHUB_SHA'],'year':1002,'digest':digest,'downloaded_sha256':expected['sha256'],'retained_original_unchanged':True}
        json.dump(result,open('evidence/downloaded-restore.json','w'),indent=2)
        print(json.dumps(result),flush=True)
        PY
    - name: Capture native failure diagnostics
      if: failure()
      shell: bash
      run: |
        mkdir -p evidence
        { python -VV; python -c 'import sqlite3; print(sqlite3.sqlite_version)'; sudo dmesg --ctime | tail -n 80; coredumpctl info --no-pager; } > evidence/native-failure.log 2>&1 || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: final-source-downloaded-restore-proof
        path: evidence
        retention-days: 14
