        assert r['source_checkpoint']['product_sha']==os.environ['CANDIDATE_SHA']
        assert r['source_checkpoint']['prior_source']['product_sha']=='2bc3c85389760ff12578857f7d2a849bc5cf9201'
        assert all(r['p4'][str(y)]['matches_control'] for y in (1001,1002))
        assert r['restore_artifact']['year']==1002
        with open(r['restore_artifact']['path'],'rb') as f:
