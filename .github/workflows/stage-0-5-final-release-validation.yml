name: Stage 0.5 recoverable late fixture
'on':
  push:
    branches:
    - sol/stage-0-5-final-release-validation
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
jobs:
  harness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: b546cf56dabe1cf2887cab0b770c2674861c83bc
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install pytest
    - name: Verify unchanged runtime, prior gates and staged handoffs
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p evidence
        test "$(git rev-parse HEAD:simulation/ate_sim)" = 43c2976e97474127ec860bcb6382988660ddadb3
        python - <<'CHECK'
        import json, os, urllib.request
        url='https://api.github.com/repos/rax0h/all-that-endures/actions/runs/38459262962/attempts/1/jobs'
        req=urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
        with urllib.request.urlopen(req) as f: data=json.load(f)
        expected={'recovery-gate','full-suite','canonical-millennium'}
        rows=[j for j in data['jobs'] if j['name'] in expected]
        assert {j['name'] for j in rows}==expected
        assert all(j['conclusion']=='success' and j['head_sha']=='fb9505a0349e083882672e2de9e8e7735b68fd77' for j in rows)
        json.dump({'runtime_sha':'2bc3c85389760ff12578857f7d2a849bc5cf9201','prior_jobs':rows},open('evidence/prior-gates.json','w'),indent=2)
        CHECK
        python -m pytest -q -o junit_family=legacy --junitxml=evidence/harness.xml simulation/tests/test_stage_0_5_final_long_harness.py 2>&1 | tee evidence/harness.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: staged-harness-evidence
        path: evidence
        retention-days: 14
        compression-level: 1
        if-no-files-found: error
  late-cold:
    needs: harness-gate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        ref: b546cf56dabe1cf2887cab0b770c2674861c83bc
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reserve hosted-runner disk for disposable conversion databases
      shell: bash
      run: |
        # Only unused preinstalled toolchains on this disposable hosted runner.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        mkdir -p evidence
        df -h . 2>&1 | tee evidence/disk-start.txt
        python -c "import shutil; assert shutil.disk_usage('.').free > 25*1024**3, 'need 25 GiB for explicit conversion and restore copies'"
    - name: Publish checked cold checkpoint
      shell: bash
      run: |
        mkdir -p evidence
        git rev-parse HEAD HEAD^{tree} HEAD:simulation/ate_sim | tee evidence/source.txt
        (
          while true; do
            date -u
            free -m
            df -h .
            ps -eo pid,ppid,rss,vsz,comm --sort=-rss | head -n 10 || true
            for f in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
              if [ -r "$f" ]; then echo "$f"; cat "$f"; fi
            done
            sleep 60
          done
        ) > >(tee evidence/resources.log) 2>&1 &
        monitor_pid=$!
        trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
        timeout --signal=TERM --kill-after=30s 350m python simulation/persistence_p5_long_validation.py --seed 843000 --initialization mature --bootstrap-year 1000 --milestones 1001 1002 --complete-format --rules-id stage-0-5-final-release --workdir evidence/late --output evidence/late.json --product-sha 2bc3c85389760ff12578857f7d2a849bc5cf9201 --workflow-sha '${{ github.sha }}' --stop-after cold 2>&1 | tee evidence/late.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: late-cold-diagnostics
        path: |-
          evidence/*.txt
          evidence/*.json
          evidence/*.log
          evidence/late/progress.jsonl
        retention-days: 14
        compression-level: 1
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: late-cold-checkpoint
        path: |-
          evidence/late/checkpoint.json
          evidence/late/p5-long-cold.sqlite
        retention-days: 14
        compression-level: 1
        if-no-files-found: error
  late-lazy:
    needs: late-cold
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        ref: b546cf56dabe1cf2887cab0b770c2674861c83bc
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reserve hosted-runner disk for disposable conversion databases
      shell: bash
      run: |
        # Only unused preinstalled toolchains on this disposable hosted runner.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        mkdir -p evidence
        df -h . 2>&1 | tee evidence/disk-start.txt
        python -c "import shutil; assert shutil.disk_usage('.').free > 25*1024**3, 'need 25 GiB for explicit conversion and restore copies'"
    - uses: actions/download-artifact@v4
      with:
        name: late-cold-checkpoint
        path: evidence/late
    - name: Publish checked lazy checkpoint
      shell: bash
      run: |
        mkdir -p evidence
        git rev-parse HEAD HEAD^{tree} HEAD:simulation/ate_sim | tee evidence/source.txt
        (
          while true; do
            date -u
            free -m
            df -h .
            ps -eo pid,ppid,rss,vsz,comm --sort=-rss | head -n 10 || true
            for f in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
              if [ -r "$f" ]; then echo "$f"; cat "$f"; fi
            done
            sleep 60
          done
        ) > >(tee evidence/resources.log) 2>&1 &
        monitor_pid=$!
        trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
        timeout --signal=TERM --kill-after=30s 350m python simulation/persistence_p5_long_validation.py --seed 843000 --initialization mature --bootstrap-year 1000 --milestones 1001 1002 --complete-format --rules-id stage-0-5-final-release --workdir evidence/late --output evidence/late.json --product-sha 2bc3c85389760ff12578857f7d2a849bc5cf9201 --workflow-sha '${{ github.sha }}' --stop-after lazy --resume-from cold 2>&1 | tee evidence/late.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: late-lazy-diagnostics
        path: |-
          evidence/*.txt
          evidence/*.json
          evidence/*.log
          evidence/late/progress.jsonl
        retention-days: 14
        compression-level: 1
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: late-lazy-checkpoint
        path: |-
          evidence/late/checkpoint.json
          evidence/late/p5-long-lazy.sqlite
        retention-days: 14
        compression-level: 1
        if-no-files-found: error
  late-complete:
    needs: late-lazy
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        ref: b546cf56dabe1cf2887cab0b770c2674861c83bc
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reserve hosted-runner disk for disposable conversion databases
      shell: bash
      run: |
        # Only unused preinstalled toolchains on this disposable hosted runner.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        mkdir -p evidence
        df -h . 2>&1 | tee evidence/disk-start.txt
        python -c "import shutil; assert shutil.disk_usage('.').free > 25*1024**3, 'need 25 GiB for explicit conversion and restore copies'"
    - uses: actions/download-artifact@v4
      with:
        name: late-lazy-checkpoint
        path: evidence/late
    - name: Publish checked complete checkpoint
      shell: bash
      run: |
        mkdir -p evidence
        git rev-parse HEAD HEAD^{tree} HEAD:simulation/ate_sim | tee evidence/source.txt
        (
          while true; do
            date -u
            free -m
            df -h .
            ps -eo pid,ppid,rss,vsz,comm --sort=-rss | head -n 10 || true
            for f in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
              if [ -r "$f" ]; then echo "$f"; cat "$f"; fi
            done
            sleep 60
          done
        ) > >(tee evidence/resources.log) 2>&1 &
        monitor_pid=$!
        trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
        timeout --signal=TERM --kill-after=30s 350m python simulation/persistence_p5_long_validation.py --seed 843000 --initialization mature --bootstrap-year 1000 --milestones 1001 1002 --complete-format --rules-id stage-0-5-final-release --workdir evidence/late --output evidence/late.json --product-sha 2bc3c85389760ff12578857f7d2a849bc5cf9201 --workflow-sha '${{ github.sha }}' --stop-after complete --resume-from lazy 2>&1 | tee evidence/late.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: late-complete-diagnostics
        path: |-
          evidence/*.txt
          evidence/*.json
          evidence/*.log
          evidence/late/progress.jsonl
        retention-days: 14
        compression-level: 1
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: late-complete-checkpoint
        path: |-
          evidence/late/checkpoint.json
          evidence/late/p5-long-complete.sqlite
        retention-days: 14
        compression-level: 1
        if-no-files-found: error
  complete-late-fixture:
    needs: late-complete
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        ref: b546cf56dabe1cf2887cab0b770c2674861c83bc
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reserve hosted-runner disk for disposable conversion databases
      shell: bash
      run: |
        # Only unused preinstalled toolchains on this disposable hosted runner.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        mkdir -p evidence
        df -h . 2>&1 | tee evidence/disk-start.txt
        python -c "import shutil; assert shutil.disk_usage('.').free > 25*1024**3, 'need 25 GiB for explicit conversion and restore copies'"
    - uses: actions/download-artifact@v4
      with:
        name: late-complete-checkpoint
        path: evidence/late
    - uses: actions/download-artifact@v4
      with:
        name: final-source-canonical-evidence
        path: canonical-evidence
        run-id: 38459262962
        github-token: ${{ github.token }}
    - name: Continue, audit, reopen and verify restore
      shell: bash
      run: |
        mkdir -p evidence
        git rev-parse HEAD HEAD^{tree} HEAD:simulation/ate_sim | tee evidence/source.txt
        (
          while true; do
            date -u
            free -m
            df -h .
            ps -eo pid,ppid,rss,vsz,comm --sort=-rss | head -n 10 || true
            for f in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
              if [ -r "$f" ]; then echo "$f"; cat "$f"; fi
            done
            sleep 60
          done
        ) > >(tee evidence/resources.log) 2>&1 &
        monitor_pid=$!
        trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
        timeout --signal=TERM --kill-after=30s 350m python simulation/persistence_p5_long_validation.py --seed 843000 --initialization mature --bootstrap-year 1000 --milestones 1001 1002 --complete-format --rules-id stage-0-5-final-release --workdir evidence/late --output evidence/late.json --product-sha 2bc3c85389760ff12578857f7d2a849bc5cf9201 --workflow-sha '${{ github.sha }}' --resume-from complete 2>&1 | tee evidence/late.log
        python - <<'PY'
        import json,hashlib
        r=json.load(open('evidence/late.json'))
        c=json.load(open('canonical-evidence/canonical-receipt.json'))
        assert r['passed'] and r['complete_format'] and r['initialization']=='mature'
        assert r['bootstrap_digest']==c['benchmark']['digest']
        assert r['product_sha']=='2bc3c85389760ff12578857f7d2a849bc5cf9201' and r['milestones']==[1001,1002]
        assert all(r['p4'][str(y)]['matches_control'] for y in (1001,1002))
        assert r['restore_artifact']['year']==1002
        with open(r['restore_artifact']['path'],'rb') as f:
            assert hashlib.file_digest(f,'sha256').hexdigest()==r['restore_artifact']['sha256']
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: final-source-late-evidence
        path: |
          evidence/*.txt
          evidence/*.json
          evidence/*.log
          evidence/late/progress.jsonl
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: final-source-year1002-restore
        path: evidence/late/p5-long-restore.sqlite
        retention-days: 14
        compression-level: 1
  downloaded-restore-proof:
    needs: complete-late-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        ref: b546cf56dabe1cf2887cab0b770c2674861c83bc
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reserve hosted-runner space for retained and operational copies
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
    - uses: actions/download-artifact@v4
      with:
        name: final-source-late-evidence
        path: downloaded-evidence
    - uses: actions/download-artifact@v4
      with:
        name: final-source-year1002-restore
        path: retained
    - name: Verify downloaded original and reopen disposable copy
      shell: bash
      run: |
        mkdir -p evidence
        git rev-parse HEAD HEAD^{tree} 2>&1 | tee evidence/source.txt
        python - <<'PY' 2>&1 | tee evidence/restore.log
        import hashlib,json,pathlib,shutil,os
        from ate_sim.persistence_lazy import open_lazy_world_session
        from persistence_p5_long_validation import _counters
        r=json.load(open('downloaded-evidence/late.json'))
        source=pathlib.Path('retained/p5-long-restore.sqlite')
        def sha(path):
            with path.open('rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
        expected=r['restore_artifact']
        assert r['product_sha']=='2bc3c85389760ff12578857f7d2a849bc5cf9201' and r['passed'] and r['complete_format']
        assert sha(source)==expected['sha256']
        assert shutil.disk_usage('.').free > source.stat().st_size+1024**3
        copy=pathlib.Path('operational.sqlite');shutil.copyfile(source,copy)
        with open_lazy_world_session(copy,rules_id=r['rules_id']) as s:
            assert s.world.year==expected['year']==1002
            assert s.pin.captured_head==expected['generation']
            assert int(s.store.db.execute("SELECT value FROM store_metadata WHERE key='format_version'").fetchone()[0])==6
            digest=s.world.digest()
            assert digest==expected['digest']==r['control']['1002']['digest']
            assert _counters(s.world)==r['control']['1002']['counters']
        assert sha(source)==expected['sha256']
        result={'passed':True,'candidate':'2bc3c85389760ff12578857f7d2a849bc5cf9201','workflow_sha':os.environ['GITHUB_SHA'],'year':1002,'digest':digest,'downloaded_sha256':expected['sha256'],'retained_original_unchanged':True}
        json.dump(result,open('evidence/downloaded-restore.json','w'),indent=2)
        print(json.dumps(result),flush=True)
        PY
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: final-source-downloaded-restore-proof
        path: evidence
        retention-days: 14
