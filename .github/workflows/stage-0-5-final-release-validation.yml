name: Stage 0.5 corrected metric and retained upgrade resume
'on':
  push:
    branches:
    - sol/stage-0-5-final-release-validation
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
  CANDIDATE_SHA: 98a37c64514084879ef77c04825e47e1f6a4fabe
  TEST_METRIC_SHA: 0883e37b03d737c5a9d196274e3486f54642d711
jobs:
  verified-runtime-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.CANDIDATE_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install pytest
    - name: Verify unchanged runtime and isolated test-function correction
      shell: bash
      run: |
        mkdir -p evidence
        git rev-parse HEAD HEAD^{tree} HEAD:simulation/ate_sim | tee evidence/source.txt
        git fetch --no-tags --depth=1 origin "${TEST_METRIC_SHA}"
        python - <<'SCOPE'
        import ast,json,os,pathlib,subprocess
        product=os.environ['CANDIDATE_SHA'];test_source=os.environ['TEST_METRIC_SHA']
        def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
        assert git('rev-parse','HEAD')==product=='98a37c64514084879ef77c04825e47e1f6a4fabe'
        assert git('rev-parse',product+':simulation/ate_sim')==git('rev-parse',test_source+':simulation/ate_sim')=='00fd97c9690e26e83754473a5cc5e688ee042b76'
        path='simulation/tests/test_stage_0_5_upgrade_memory.py'
        allowed={path,'simulation/STAGE_0_5_MEMORY_METRIC_REPAIR.md','simulation/STAGE_0_5_UPGRADE_MEMORY_REPAIR_PROGRESS.md'}
        changed=set(git('diff','--name-only',product,test_source).splitlines())
        assert changed==allowed,changed
        before=git('show',product+':'+path);after=git('show',test_source+':'+path)
        target='test_validation_only_fits_where_disposable_catalog_exhausts_address_space'
        old_tree=ast.parse(before);new_tree=ast.parse(after)
        def unchanged(tree):
            return [ast.dump(n,include_attributes=False) for n in tree.body if not(isinstance(n,ast.FunctionDef) and n.name==target)]
        assert unchanged(old_tree)==unchanged(new_tree)
        assert sum(isinstance(n,ast.FunctionDef) and n.name==target for n in new_tree.body)==1
        pathlib.Path('evidence/corrected_upgrade_memory_test.py').write_text(after+'\n')
        json.dump(dict(runtime_product_sha=product,test_metric_sha=test_source,unchanged_runtime=True,only_changed_test=target,changed_paths=sorted(changed)),open('evidence/test-scope.json','w'),indent=2)
        SCOPE
    - name: Verify original full-suite and recovery artifact evidence
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python - <<'EVIDENCE'
        import hashlib,json,os,pathlib,urllib.request,urllib.error,zipfile,xml.etree.ElementTree as ET
        base='https://api.github.com/repos/rax0h/all-that-endures'
        headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
        def request(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as response:return json.load(response)
        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args):return None
        opener=urllib.request.build_opener(NoRedirect)
        run=38603776178;workflow='5f0d2be10f8f4a4fc3f0ac1a24165f102ed7ca72';product=os.environ['CANDIDATE_SHA']
        for job_id,name,conclusion in ((115989332743,'recovery-gate','success'),(115993372980,'full-suite','failure')):
            job=request(base+'/actions/jobs/'+str(job_id))
            assert job['run_id']==run and job['name']==name and job['status']=='completed' and job['conclusion']==conclusion
        origins=[(11918576896,'final-source-full-suite',67445,'7dbe7af7e6e838845849d9169aef6cc2f5ddf8ccf355b8b6575ad0736d1d60cc','full'),
                 (11914843405,'final-source-recovery-evidence',5728,'b111cd1dbe9e76c540aefd3fb711c823876d3cbabaeb063256aafaaa057ae3ab','recovery')]
        for aid,name,size,digest,directory in origins:
            url=base+'/actions/artifacts/'+str(aid);m=request(url)
            assert m['id']==aid and m['name']==name and not m['expired'] and m['size_in_bytes']==size and m['digest']=='sha256:'+digest
            assert m['workflow_run']['id']==run and m['workflow_run']['head_sha']==workflow
            try:
                opener.open(urllib.request.Request(url+'/zip',headers=headers))
                raise AssertionError('expected archive redirect')
            except urllib.error.HTTPError as error:
                assert error.code==302;location=error.headers['Location'];assert location.startswith('https://')
            with urllib.request.urlopen(location) as response:payload=response.read()
            assert len(payload)==size and hashlib.sha256(payload).hexdigest()==digest
            archive=pathlib.Path('evidence')/(directory+'.zip');archive.write_bytes(payload)
            target=pathlib.Path('evidence')/directory;target.mkdir()
            with zipfile.ZipFile(archive) as z:
                assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
                z.extractall(target)
            assert (target/'source.txt').read_text().splitlines()==[product,'6de3392f6e70ccc0dde0f7ca28ac39f91d411785']
        xml=ET.parse('evidence/full/full.xml').getroot();suites=list(xml)
        assert len(suites)==1
        suite=suites[0]
        assert {k:int(suite.attrib[k]) for k in ('tests','failures','errors','skipped')}==dict(tests=2487,failures=1,errors=0,skipped=0)
        # pytest's summary includes two passing subtests without separate XML rows.
        cases=list(suite.iter('testcase'));assert len(cases)==2485
        bad=[t for t in cases if t.find('failure') is not None or t.find('error') is not None or t.find('skipped') is not None]
        assert len(bad)==1
        f=bad[0];assert f.attrib['file']=='simulation/tests/test_stage_0_5_upgrade_memory.py'
        assert f.attrib['name']=='test_validation_only_fits_where_disposable_catalog_exhausts_address_space'
        assert f.find('failure').attrib['message']=='assert 1426280 < 1426280'
        r=json.load(open('evidence/recovery/p5.json'))
        assert r['passed'] and r['complete_format'] and r['final_year']==10
        assert r['control_final_digest']=='3301d4e4a6a2f415679cabe62754813440034cf4c190035c79ba82cc7b8e378e'
        focused=ET.parse('evidence/recovery/focused.xml').getroot()
        assert all(int(s.attrib['failures'])==int(s.attrib['errors'])==int(s.attrib['skipped'])==0 for s in focused)
        assert sum(int(s.attrib['tests']) for s in focused)==95
        json.dump(dict(original_run=run,original_workflow_sha=workflow,runtime_product_sha=product,original_full_suite_passed=False,original_junit_summary_tests=2487,original_junit_main_cases=2485,unchanged_main_tests_passed=2484,subtests_passed=2,only_failure=f.attrib['name'],recovery_passed=True,recovery_final_year=10,artifact_ids=[a[0] for a in origins]),open('evidence/prior-gates.json','w'),indent=2)
        EVIDENCE
    - name: Run corrected guarded cases after cold and warm pytest parents
      shell: bash
      run: |
        python -m pytest -q -o junit_family=legacy --junitxml=evidence/corrected-memory.xml evidence/corrected_upgrade_memory_test.py -k validation_only_fits_where_disposable_catalog_exhausts_address_space 2>&1 | tee evidence/corrected-memory.log
        python - <<'RESULT'
        import json,os,xml.etree.ElementTree as ET
        r=ET.parse('evidence/corrected-memory.xml').getroot();cases=list(r.iter('testcase'))
        assert len(cases)==2
        assert all(t.find('failure') is None and t.find('error') is None and t.find('skipped') is None for t in cases)
        assert {t.attrib['name'].rsplit('[',1)[1] for t in cases}=={'0]','220]'}
        measurements=[]
        for t in cases:
            p=[p for p in t.iter('property') if p.attrib['name']=='guarded_child_measurements'];assert len(p)==1
            rows=json.loads(p[0].attrib['value'])
            assert len(rows)==2 and rows[0]['passed'] is False and rows[1]['passed'] is True
            assert all(row['address_space_limit']==110*1024**2 for row in rows)
            assert rows[1]['peak_rss_kib']<rows[0]['peak_rss_kib']
            measurements.append(dict(case=t.attrib['name'],measurements=rows))
        prior=json.load(open('evidence/prior-gates.json'));scope=json.load(open('evidence/test-scope.json'))
        assert prior['runtime_product_sha']==scope['runtime_product_sha']==os.environ['CANDIDATE_SHA']
        receipt=dict(verified_runtime_gates_passed=True,original_full_suite_passed=False,prior=prior,test_scope=scope,corrected_cases=measurements,executing_candidate=os.environ['CANDIDATE_SHA'],workflow_sha=os.environ['GITHUB_SHA'])
        json.dump(receipt,open('evidence/reused-runtime-gates.json','w'),indent=2)
        print(json.dumps(receipt),flush=True)
        RESULT
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: corrected-metric-and-reused-gates
        path: evidence
        retention-days: 14
        if-no-files-found: error
  late-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.CANDIDATE_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reserve hosted-runner disk for disposable conversion databases
      shell: bash
      run: |
        # Only unused preinstalled toolchains on this disposable hosted runner.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        mkdir -p evidence
        df -h . 2>&1 | tee evidence/disk-start.txt
        python -c "import shutil; assert shutil.disk_usage('.').free > 25*1024**3, 'need 25 GiB for explicit conversion and restore copies'"
    - name: Download and verify exact retained lazy archive
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        mkdir -p evidence/late
        python - <<'ARCHIVE'
        import hashlib,json,os,pathlib,urllib.request,urllib.error,zipfile
        base='https://api.github.com/repos/rax0h/all-that-endures/actions/artifacts/11870590333'
        headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
        with urllib.request.urlopen(urllib.request.Request(base,headers=headers)) as response:metadata=json.load(response)
        expected='409cf0230ff1606b7eddd587a69c22076c11447eb6497e642e584c4fd3b74ef9'
        assert metadata['id']==11870590333 and not metadata['expired'] and metadata['name']=='late-lazy-checkpoint'
        assert metadata['size_in_bytes']==1339563957 and metadata['digest']=='sha256:'+expected
        assert metadata['workflow_run']['id']==38508408370 and metadata['workflow_run']['head_sha']=='124c3215468a60862b7848086f00a8e768a6ed66'
        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,*args):return None
        opener=urllib.request.build_opener(NoRedirect)
        try:
            opener.open(urllib.request.Request(base+'/zip',headers=headers))
            raise AssertionError('expected artifact redirect')
        except urllib.error.HTTPError as error:
            assert error.code==302
            location=error.headers['Location']
            assert location.startswith('https://')
        # The signed object URL receives no GitHub credential header.
        archive=pathlib.Path('evidence/retained-lazy.zip');h=hashlib.sha256();size=0
        with urllib.request.urlopen(location) as response,archive.open('wb') as output:
            while chunk:=response.read(1024*1024):
                output.write(chunk);h.update(chunk);size+=len(chunk)
        assert h.hexdigest()==expected and size==1339563957
        with zipfile.ZipFile(archive) as z:
            assert set(z.namelist())=={'checkpoint.json','p5-long-lazy.sqlite'}
            z.extractall('evidence/late')
        receipt=json.load(open('evidence/late/checkpoint.json'))
        assert receipt['stage']=='lazy' and receipt['workflow_sha']=='124c3215468a60862b7848086f00a8e768a6ed66'
        assert receipt['config']==dict(seed=843000,milestones=[1001,1002],bootstrap_year=1000,rules_id='stage-0-5-final-release',product_sha='2bc3c85389760ff12578857f7d2a849bc5cf9201',complete_format=True,initialization='mature',simulation_schema='ate-world-p2a/1')
        with open('evidence/late/p5-long-lazy.sqlite','rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==receipt['database']['sha256']
        json.dump(dict(artifact_id=11870590333,origin_run=38508408370,archive_sha256=expected,archive_bytes=size,source_receipt=receipt,executing_candidate=os.environ['CANDIDATE_SHA']),open('evidence/source-artifact.json','w'),indent=2)
        archive.unlink()
        ARCHIVE
    - name: Verify reused lazy checkpoint provenance
      shell: bash
      run: |
        python - <<'CHECK'
        import json
        r=json.load(open('evidence/late/checkpoint.json'))
        assert r['stage']=='lazy' and r['workflow_sha']=='124c3215468a60862b7848086f00a8e768a6ed66'
        assert r['config']['product_sha']=='2bc3c85389760ff12578857f7d2a849bc5cf9201'
        CHECK
        cp evidence/late/checkpoint.json evidence/source-checkpoint.json
    - name: Upgrade retained year1000 fixture under 8 GiB address-space guard
      shell: bash
      run: |
        mkdir -p evidence
        git rev-parse HEAD HEAD^{tree} HEAD:simulation/ate_sim | tee evidence/source.txt
        (
          while true; do
            date -u
            free -m
            df -h .
            ps -eo pid,ppid,rss,vsz,comm --sort=-rss | head -n 10 || true
            for f in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
              if [ -r "$f" ]; then echo "$f"; cat "$f"; fi
            done
            sleep 60
          done
        ) > >(tee evidence/resources.log) 2>&1 &
        monitor_pid=$!
        trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
        timeout --signal=TERM --kill-after=30s 350m python - --seed 843000 --initialization mature --bootstrap-year 1000 --milestones 1001 1002 --complete-format --rules-id stage-0-5-final-release --workdir evidence/late --output evidence/late.json --product-sha "${CANDIDATE_SHA}" --checkpoint-product-sha 2bc3c85389760ff12578857f7d2a849bc5cf9201 --workflow-sha '${{ github.sha }}' --stop-after complete --resume-from lazy <<'PROBE' 2>&1 | tee evidence/late.log
        import functools,json,resource,runpy,time,pathlib
        def memory():
            status=dict(line.split(':',1) for line in pathlib.Path('/proc/self/status').read_text().splitlines() if ':' in line)
            return dict(rss=status['VmRSS'].strip(),virtual_memory=status['VmSize'].strip(),peak_rss_kib=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss)
        from ate_sim import persistence_catalog_copy as copy
        from ate_sim import persistence_event_copy_normalization as normalization
        # Limit only this Python process; leave room for the runner and artifact upload.
        resource.setrlimit(resource.RLIMIT_AS,(8*1024**3,8*1024**3))
        def observe(module,name):
            original=getattr(module,name)
            @functools.wraps(original)
            def wrapped(*args,**kwargs):
                started=time.monotonic()
                print(json.dumps({'probe':name,'phase':'started',**memory()}),flush=True)
                try:
                    result=original(*args,**kwargs)
                except BaseException as error:
                    print(json.dumps({'probe':name,'phase':'failed','exception':type(error).__name__,**memory()}),flush=True)
                    raise
                print(json.dumps({'probe':name,'phase':'finished','seconds':time.monotonic()-started,**memory()}),flush=True)
                for argument in args:
                    if type(argument).__name__=='ConversionWorkspace':
                        print(json.dumps(dict(workspace=argument.metrics)),flush=True)
                return result
            setattr(module,name,wrapped)
        original_phase=copy._copy_phase
        def measured_phase(phase,path):
            print(json.dumps(dict(copy_phase=phase,**memory())),flush=True)
            return original_phase(phase,path)
        copy._copy_phase=measured_phase
        for name in ('_owner_sources','validate_initial_catalog_inputs','stage_initial_catalog','_backing_rosters','_check_reference_targets','_check_backing_graph','_empty_destination','_verify_catalog'):
            observe(copy,name)
        for name in ('capture_bodies','normalize_events'):
            observe(normalization,name)
        print('REPAIR CANDIDATE: 8 GiB address-space cap; complete checkpoint remains partial evidence',flush=True)
        runpy.run_module('persistence_p5_long_validation',run_name='__main__')
        PROBE
        python - <<'VERIFY'
        import json,hashlib,os
        old=json.load(open('evidence/source-checkpoint.json'))
        r=json.load(open('evidence/late/checkpoint.json'))
        assert r['config']['product_sha']==os.environ['CANDIDATE_SHA']
        assert r['checkpoint_product_sha']=='2bc3c85389760ff12578857f7d2a849bc5cf9201'
        assert r['source_checkpoint']['workflow_sha']=='124c3215468a60862b7848086f00a8e768a6ed66'
        assert r['source_checkpoint']['database']==old['database']
        with open('evidence/late/p5-long-lazy.sqlite','rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==old['database']['sha256']
        assert r['source_checkpoint']['receipt_sha256']==hashlib.sha256(open('evidence/source-checkpoint.json','rb').read()).hexdigest()
        VERIFY
    - name: Capture native failure diagnostics
      if: failure()
      shell: bash
      run: |
        mkdir -p evidence
        { python -VV; python -c 'import sqlite3; print(sqlite3.sqlite_version)'; sudo dmesg --ctime | tail -n 80; coredumpctl info --no-pager; } > evidence/native-failure.log 2>&1 || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: repair-late-complete-evidence
        path: |-
          evidence/*.txt
          evidence/*.json
          evidence/*.log
          evidence/late/progress.jsonl
        retention-days: 14
        compression-level: 1
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      if: success()
      with:
        name: late-complete-checkpoint
        path: |-
          evidence/late/checkpoint.json
          evidence/late/p5-long-complete.sqlite
        retention-days: 14
        compression-level: 1
        if-no-files-found: error
    needs:
    - verified-runtime-gates
  complete-late-fixture:
    needs: late-complete
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.CANDIDATE_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Reserve hosted-runner disk for disposable conversion databases
      shell: bash
      run: |
        # Only unused preinstalled toolchains on this disposable hosted runner.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        mkdir -p evidence
        df -h . 2>&1 | tee evidence/disk-start.txt
        python -c "import shutil; assert shutil.disk_usage('.').free > 25*1024**3, 'need 25 GiB for explicit conversion and restore copies'"
    - uses: actions/download-artifact@v4
      with:
        name: late-complete-checkpoint
        path: evidence/late
    - uses: actions/download-artifact@v4
      with:
        name: final-source-canonical-evidence
        path: canonical-evidence
        run-id: 38459262962
        github-token: ${{ github.token }}
    - name: Continue, audit, reopen and verify restore
      shell: bash
      run: |
        mkdir -p evidence
        git rev-parse HEAD HEAD^{tree} HEAD:simulation/ate_sim | tee evidence/source.txt
        (
          while true; do
            date -u
            free -m
            df -h .
            ps -eo pid,ppid,rss,vsz,comm --sort=-rss | head -n 10 || true
            for f in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max; do
              if [ -r "$f" ]; then echo "$f"; cat "$f"; fi
            done
            sleep 60
          done
        ) > >(tee evidence/resources.log) 2>&1 &
        monitor_pid=$!
        trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
        timeout --signal=TERM --kill-after=30s 350m python simulation/persistence_p5_long_validation.py --seed 843000 --initialization mature --bootstrap-year 1000 --milestones 1001 1002 --complete-format --rules-id stage-0-5-final-release --workdir evidence/late --output evidence/late.json --product-sha "${CANDIDATE_SHA}" --workflow-sha '${{ github.sha }}' --resume-from complete 2>&1 | tee evidence/late.log
        python - <<'PY'
        import json,hashlib,os
        r=json.load(open('evidence/late.json'))
        c=json.load(open('canonical-evidence/canonical-receipt.json'))
        assert r['passed'] and r['complete_format'] and r['initialization']=='mature'
