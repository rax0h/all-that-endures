name: millennium-history-843017
on:
  push:
    branches: [sol/millennium-history-843017]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 1000-year history
        run: python simulation/millennium_history_report.py
