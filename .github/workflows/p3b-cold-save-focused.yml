name: p3b-cold-save-focused-v4
on:
  push:
    branches: [sol/p3b-cold-save-candidate]
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: cold save focused
        run: >-\n          python -m pytest -q -s\n          simulation/tests/test_persistence_cold_save.py\n          simulation/tests/test_persistence_cold_save_failures.py
