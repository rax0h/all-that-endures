name: Stage 0.5 targeted closeout compatibility

on:
  push:
    branches:
      - sol-stage-0-5-targeted-closeout-5dd5

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Run targeted closeout regressions
        run: |
          python -m pytest -q \
            simulation/tests/test_persistence_lazy_people.py \
            simulation/tests/test_persistence_p2b_review_regressions.py \
            simulation/tests/test_community_index.py \
            simulation/tests/test_persistence_lazy_communities.py
