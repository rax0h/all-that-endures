name: p3b-lifecycle-cache-measurement
on:
  push:
    branches:
      - sol/p3b-lifecycle-candidate
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: warm-cache four-segment lifecycle measurement
        run: python -m pytest -q -s "simulation/tests/test_persistence_history_operations.py::test_streaming_history_bounds_and_detach_cost_are_measured[4]"
