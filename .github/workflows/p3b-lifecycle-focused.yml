name: p3b-lifecycle-final-full
on:
  push:
    branches:
      - sol/p3b-lifecycle-candidate
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: full simulation tests
        run: python -m pytest -q simulation/tests
