name: p3b-lifecycle-final-targeted
on:
  push:
    branches:
      - sol/p3b-lifecycle-candidate
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: lifecycle completion proofs
        run: python -m pytest -q -s simulation/tests/test_persistence_lifecycle.py simulation/tests/test_persistence_history_operations.py::test_verify_history_missing_warm_segment_fails_without_mutation simulation/tests/test_persistence_history_operations.py::test_archive_mid_encoding_failure_leaves_no_final_and_session_usable "simulation/tests/test_persistence_history_operations.py::test_streaming_history_bounds_and_detach_cost_are_measured[4]"
