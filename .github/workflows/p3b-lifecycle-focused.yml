name: p3b-lifecycle-final-measurements
on:
  push:
    branches:
      - sol/p3b-lifecycle-candidate
jobs:
  measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: exact final lifecycle measurements
        run: python -m pytest -q -s simulation/tests/test_persistence_history_operations.py -k streaming_history_bounds_and_detach_cost_are_measured
