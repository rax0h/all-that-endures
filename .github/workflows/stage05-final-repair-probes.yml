name: stage-0-5-bounded-repair-probes
on:
  push:
    branches: [sim/stage-0-5-stabilization]
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Repaired R1/R2 and affected P4 lazy families
        run: |
          python -m pytest -q simulation/tests/test_stage_0_5_closeout.py -k 'not r3'
          python -m pytest -q simulation/tests/test_persistence_lazy_*.py simulation/tests/test_persistence_lazy_identity.py simulation/tests/test_persistence_lifecycle.py simulation/tests/test_persistence_history_operations.py simulation/tests/test_persistence_session_open.py simulation/tests/test_persistence_cold_save_failures.py simulation/tests/test_persistence_tracking.py simulation/tests/test_persistence_p2c.py
      - name: Short independent P5 continuation and reboot
        run: |
          python simulation/persistence_p5_validation.py --seed 843000 --pre-years 3 --continuation-years 4 --reopen-years 3 --output /tmp/p5-final-repair.json
          python simulation/specific_test.py --seed 843000 --years 10 --section all
