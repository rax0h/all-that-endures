name: Stage 0.5 complete candidate validation

on:
  push:
    branches: [sol/stage-0-5-complete-validation]

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .:simulation
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a65d6afa08921477cbaf419695b08f0f98dea4b1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Verify exact candidate source
        run: test "$(git rev-parse HEAD)" = a65d6afa08921477cbaf419695b08f0f98dea4b1
      - name: Confirm unchanged production from passing P5
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          hashes = json.loads(Path('simulation/stage_0_5_complete_candidate_validation.json').read_text())['source_sha256']
          changed = [p for p, expected in hashes.items() if hashlib.sha256(Path(p).read_bytes()).hexdigest() != expected]
          assert not changed, changed
          print(f'All {len(hashes)} production/script hashes match the passing P5 source')
          PY
      - name: Complete applicable simulation suite
        run: |
          mkdir -p "$RUNNER_TEMP/ate-complete-suite"
          set -o pipefail
          python -m pytest -vv --durations=25 simulation/tests --junitxml="$RUNNER_TEMP/ate-complete-suite/suite.xml" -o junit_family=legacy 2>&1 | tee "$RUNNER_TEMP/ate-complete-suite/suite.log"
      - name: Retain suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-candidate-full-suite
          retention-days: 14
          path: ${{ runner.temp }}/ate-complete-suite

