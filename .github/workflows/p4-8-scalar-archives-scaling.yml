name: P4.8 scalar archives scaling

on:
  push:
    branches:
      - sol-p4-8-scalar-archives-scaling

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python - <<'PY'
          from pathlib import Path
          import tempfile
          from ate_sim.core import World
          from ate_sim.transmission import Transmission
          from ate_sim.agency import MotiveState
          from ate_sim.persistence_session import write_cold_snapshot
          from ate_sim.persistence_lazy import convert_cold_to_lazy, open_lazy_world_session

          RULES="p4-8-scalar-archive-scaling"

          def build(n):
              w=World(849000+n)
              for i in range(1,n+1):
                  item_id = 7 if i <= 2 else i + 1000
                  w.transmission.records[i]=Transmission(
                      i,0,"teaching","skill",item_id,
                      "person",i,"person",i+1,i,.9,.01
                  )
                  w.agency.motives[i]=MotiveState(
                      .1,.2,.3,.4,.5,.6,.7,.8
                  )
              w.transmission.next_id=n+1
              return w

          def measure(n):
              with tempfile.TemporaryDirectory() as td:
                  td=Path(td)
                  cold=td/"cold.sqlite"
                  lazy=td/"lazy.sqlite"
                  write_cold_snapshot(build(n),cold,rules_id=RULES)
                  convert_cold_to_lazy(cold,lazy,rules_id=RULES)
                  with open_lazy_world_session(lazy,rules_id=RULES) as s:
                      open_diag=s.store.diagnostics()
                      assert s.transmissions.diagnostics()["payload_loads"] == 0
                      assert s.motives.diagnostics()["payload_loads"] == 0

                      before=s.store.diagnostics()
                      history=s.world.transmission.history("skill",7)
                      motive=s.world.agency.motives[n]
                      after=s.store.diagnostics()
                      fixed_reads=after.payload_reads-before.payload_reads
                      fixed_bytes=after.payload_read_bytes-before.payload_read_bytes

                      s.store.reset_diagnostics()
                      s.world.agency.motives[n].wealth=.95
                      s.save()
                      save_diag=s.store.diagnostics()

                      result={
                          "n":n,
                          "open_payload_reads":open_diag.payload_reads,
                          "open_payload_bytes":open_diag.payload_read_bytes,
                          "fixed_query_payload_reads":fixed_reads,
                          "fixed_query_payload_bytes":fixed_bytes,
                          "history_ids":[r.id for r in history],
                          "motive_wealth":motive.wealth,
                          "save_payload_writes":save_diag.payload_writes,
                          "save_payload_write_bytes":save_diag.payload_write_bytes,
                          "resident_transmissions":s.transmissions.diagnostics()["resident_records"],
                          "resident_motives":s.motives.diagnostics()["resident_records"],
                      }
                      print("SCALAR_AFTER",result)
                      return result

          small=measure(1000)
          large=measure(10000)
          assert small["open_payload_reads"] == large["open_payload_reads"]
          assert small["fixed_query_payload_reads"] == large["fixed_query_payload_reads"]
          assert small["history_ids"] == large["history_ids"] == [1,2]
          assert small["save_payload_writes"] == large["save_payload_writes"]
          assert large["resident_transmissions"] <= 2
          assert large["resident_motives"] <= 1
          PY
