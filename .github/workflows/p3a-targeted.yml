name: p3a-full
on:
  push:
    branches: [sol/p3a-sealed-event-prefix]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: one full suite for P3A
        run: pytest -q simulation/tests
