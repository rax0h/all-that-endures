name: Stage 0.5 exact mature continuation
'on':
  push:
    branches: [sol/stage-0-5-mature-continue]
    paths:
    - .github/workflows/stage-0-5-mature-continue.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-0-5-mature-continuation
  cancel-in-progress: false
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
  RUNTIME_SHA: bbc3cbf11becb58aa4b9483114559fd1296878f1
  HARNESS_SHA: beab83f2e96e5aee704f479d008f18a3e6b909f9
jobs:
  mature-continue:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.HARNESS_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check mature continuation wiring
      run: |
        python -m pip install pytest pyyaml
        python -m pytest -q simulation/tests/test_construction_mature_continue.py simulation/tests/test_checkpoint_artifacts.py
    - name: Reserve disk on this disposable runner
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell
        sudo find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 ! -name Python -exec rm -rf {} +
        sudo docker image prune -af
        mkdir -p evidence
        df -h . | tee evidence/disk-start.txt
    - name: Continue exact mature checkpoint
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        timeout --signal=TERM --kill-after=30s 300m python -m simulation.construction_mature_continue 2>&1 | tee evidence/continue.log
        continue_status=${PIPESTATUS[0]}
        exit "$continue_status"
    - name: Retain diagnostics
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: construction-mature-continue-diagnostics
        path: |
          evidence/continue.log
          evidence/disk-start.txt
          evidence/continue-summary.json
        retention-days: 14
    - name: Retain continued checkpoint
      uses: actions/upload-artifact@v4
      with:
        name: construction-mature-continued
        path: evidence/continued
        if-no-files-found: error
        retention-days: 14
