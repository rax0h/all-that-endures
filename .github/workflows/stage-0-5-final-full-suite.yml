name: Stage 0.5 final frozen full suite
on:
  push:
    branches: [sim/stage-0-5-r3-final-suite-gate]
jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONPATH: .:simulation
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Run complete Stage 0.5 simulation suite (frozen implementation)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q simulation/tests 2>&1 | tee /tmp/stage-0-5-final-pytest.log
      - name: Upload final full-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-0-5-final-pytest-log
          path: /tmp/stage-0-5-final-pytest.log
          retention-days: 30
          if-no-files-found: warn
