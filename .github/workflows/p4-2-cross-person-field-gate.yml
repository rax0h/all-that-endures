name: P4.2 cross Person field gate

on:
  push:
    branches:
      - sol-p4-2-cross-person-field-gate

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: PYTHONPATH=simulation:. python -m pytest -q simulation/tests/test_persistence_lazy_people.py::test_cross_boundary_person_field_edit_saves_both_authorities_and_topology_stays_guarded
