name: P4.11A lineage scaling

on:
  push:
    branches:
      - sol-p4-11a-lineage-scaling

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python - <<'PY'
          from pathlib import Path
          import tempfile
          from ate_sim.core import World
          from ate_sim.lineage import LineageNode
          from ate_sim.persistence_session import write_cold_snapshot
          from ate_sim.persistence_lazy import convert_cold_to_lazy, open_lazy_world_session

          RULES="p4-11a-lineage-scaling"

          def build(n):
              w=World(850000+n)
              w.lineage.nodes[("practice",1)] = LineageNode(
                  "practice",1,(),101,1
              )
              w.lineage.nodes[("practice",2)] = LineageNode(
                  "practice",2,(("practice",1),),102,2
              )
              w.lineage.nodes[("practice",3)] = LineageNode(
                  "practice",3,(("practice",2),),103,3
              )
              for i in range(4,n+1):
                  w.lineage.nodes[("artifact",i)] = LineageNode(
                      "artifact",i,(),100000+i,i
                  )
              return w

          def measure(n):
              with tempfile.TemporaryDirectory() as td:
                  td=Path(td)
                  cold=td/"cold.sqlite"
                  lazy=td/"lazy.sqlite"
                  write_cold_snapshot(build(n),cold,rules_id=RULES)
                  convert_cold_to_lazy(cold,lazy,rules_id=RULES)
                  with open_lazy_world_session(lazy,rules_id=RULES) as s:
                      open_diag=s.store.diagnostics()
                      assert s.lineage_nodes.diagnostics()["payload_loads"] == 0

                      s.store.reset_diagnostics()
                      ancestors=s.world.lineage.ancestors("practice",3)
                      point_diag=s.store.diagnostics()

                      s.store.reset_diagnostics()
                      s.world.lineage.nodes[("practice",2)].origin_year=22
                      s.save()
                      save_diag=s.store.diagnostics()

                      result={
                          "n":n,
                          "open_payload_reads":open_diag.payload_reads,
                          "open_payload_bytes":open_diag.payload_read_bytes,
                          "point_payload_reads":point_diag.payload_reads,
                          "point_payload_bytes":point_diag.payload_read_bytes,
                          "ancestors":sorted(ancestors),
                          "save_payload_writes":save_diag.payload_writes,
                          "save_payload_write_bytes":save_diag.payload_write_bytes,
                          "resident_nodes":s.lineage_nodes.diagnostics()["resident_records"],
                      }
                      print("LINEAGE_AFTER",result)
                      return result

          small=measure(1000)
          large=measure(10000)
          assert small["open_payload_reads"] == large["open_payload_reads"]
          assert small["point_payload_reads"] == large["point_payload_reads"] == 3
          assert small["ancestors"] == large["ancestors"] == [
              ("practice",1),("practice",2)
          ]
          assert small["save_payload_writes"] == large["save_payload_writes"]
          assert large["resident_nodes"] <= 3
          PY
