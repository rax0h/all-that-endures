name: Stage 0.5 closeout short gates

on:
  push:
    branches:
      - sol-stage-0-5-closeout-short

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Targeted Stage 0.5 smoke
        run: python simulation/specific_test.py --seed 843000 --years 10 --section all
      - name: Compact persistence failure lifecycle compatibility battery
        run: |
          python -m pytest -q             simulation/tests/test_persistence_lazy_store_failures.py             simulation/tests/test_persistence_lifecycle.py             simulation/tests/test_persistence_session_open.py             simulation/tests/test_persistence_cold_save_failures.py             simulation/tests/test_persistence_lazy_identity.py             simulation/tests/test_persistence_p2c.py
