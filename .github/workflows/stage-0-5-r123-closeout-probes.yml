name: stage-0-5-r123-closeout-probes
on:
  push:
    branches:
      - sim/stage-0-5-r123-closeout-probes
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Reproduce R1-R3
        run: python -m pytest -sv -q simulation/tests/test_stage_0_5_architect_closeout.py
