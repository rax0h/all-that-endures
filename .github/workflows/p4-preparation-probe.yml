name: p4-preparation-probe
on:
  push:
    branches:
      - sol/p4-preparation
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: diagnostic fixture tests
        run: python -m pytest -q simulation/tests/test_persistence_p4_probe.py
      - name: bounded 1k-10k baseline
        run: python simulation/persistence_p4_probe.py --sizes 1000 10000 --source-sha "$GITHUB_SHA"
