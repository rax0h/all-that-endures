name: P4.2 hybrid digest diagnostic

on:
  push:
    branches:
      - sol-p4-2-hybrid-digest-diagnostic

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python - <<'PY'
          from pathlib import Path
          import tempfile
          from collections import Counter
          from ate_sim import Simulation, generate_world
          from ate_sim.persistence_session import write_cold_snapshot
          from ate_sim.persistence_lazy import convert_cold_to_lazy, open_lazy_world_session
          from ate_sim.persistence_adapters import META, COLLECTION_LAYOUT, RECORD_SCHEMA

          RULES="diag-hybrid-digest"

          def snap(t):
              return {
                  "dirty": Counter(ns for ns,_ in t._dirty),
                  "deleted": Counter(ns for ns,_ in t._deleted),
                  "manifest_dirty": t._manifest_dirty,
                  "sizes": {
                      ns: len(container)
                      for ns,container in t._root_containers.items()
                      if ns not in ("world.events","world.people")
                  },
              }

          with tempfile.TemporaryDirectory() as d:
              d=Path(d)
              control=generate_world(918273,width=8,height=6,settlements=1)
              source=generate_world(918273,width=8,height=6,settlements=1)
              control.event_ids={event.id for event in control.events}
              source.event_ids={event.id for event in source.events}
              cold=d/"cold.sqlite"; lazy=d/"lazy.sqlite"
              write_cold_snapshot(source,cold,rules_id=RULES)
              convert_cold_to_lazy(cold,lazy,rules_id=RULES)
              Simulation(control).step()
              expected=control.digest()

              s=open_lazy_world_session(lazy,rules_id=RULES)
              try:
                  t=s._eager_tracker
                  Simulation(s.world).step()
                  before=snap(t)
                  actual=s.world.digest()
                  after=snap(t)
                  print("DIGEST_EQUAL",actual==expected)
                  changed=[]
                  all_ns=sorted(set(before["sizes"])|set(after["sizes"])|set(before["dirty"])|set(after["dirty"]))
                  for ns in all_ns:
                      row=(ns,
                           before["sizes"].get(ns),after["sizes"].get(ns),
                           before["dirty"][ns],after["dirty"][ns],
                           before["deleted"][ns],after["deleted"][ns])
                      if row[1:]!=(row[2],row[2],row[4],row[4],row[6],row[6]):
                          pass
                      if (before["sizes"].get(ns)!=after["sizes"].get(ns)
                          or before["dirty"][ns]!=after["dirty"][ns]
                          or before["deleted"][ns]!=after["deleted"][ns]):
                          changed.append(row)
                  print("MANIFEST_DIRTY_BEFORE_AFTER",before["manifest_dirty"],after["manifest_dirty"])
                  print("DIGEST_MUTATIONS",changed)
                  print("PEOPLE_DIAG",s.world.people.diagnostics())
                  gen=s.save()
                  print("GEN",gen)
                  head=s.store.checked_head()
                  metadata={k:v for k,v,_ in s.store.read_records(META,expected_record_schema=RECORD_SCHEMA)}
                  layout=metadata.get(COLLECTION_LAYOUT) or s.manifest["collections"]
                  mismatches=[]
                  for ns,desc in layout.items():
                      if ns in ("world.events","world.people"):
                          continue
                      hc=head.namespace_counts.get(ns,(0,0))[0]
                      if hc!=desc[1]:
                          mismatches.append((ns,desc[1],hc))
                  print("POST_SAVE_MISMATCHES",mismatches)
              finally:
                  s.close()
          PY
