name: P4.1 corrected full suite gate
# Triggered from exact repaired target bytes.

on:
  push:
    branches:
      - sol/p4-1-foundation-full

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Verify exact repaired source compiles
        run: python -m py_compile simulation/ate_sim/persistence_lazy_store.py
      - name: Full simulation test suite
        run: PYTHONPATH=. python -m pytest -vv --durations=20 simulation/tests
