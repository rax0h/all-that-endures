name: P4 aspiration pilot gate

on:
  push:
    branches:
      - sol-p4-aspiration-pilot-gate

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: PYTHONPATH=simulation:. python -m pytest -q simulation/tests/test_persistence_lazy_aspirations.py simulation/tests/test_persistence_lazy_people.py -k "aspiration or cross_boundary_person_alias_restores_lazily_and_eager_mutation_fails_closed or cross_boundary_person_field_edit or owner_transfer"
