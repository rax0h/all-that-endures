name: Stage0.6 verified fixture preservation
'on':
  push:
    branches: [sol/durable-proof-map]
    paths: [simulation/stage_0_6_fixture_preservation_request.json]
  workflow_dispatch:
    inputs:
      mode:
        description: Small round-trip smoke only, or smoke then preserve both pinned inputs
        type: choice
        options: [smoke, preserve]
        default: smoke
permissions:
  contents: write
  actions: read
concurrency:
  group: stage06-fixture-preservation
  cancel-in-progress: false
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  smoke:
    if: github.repository == 'rax0h/all-that-endures'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - run: python -m pip install pytest==9.2.0 pyyaml==6.0.3
      - name: Verify bounded preservation and restore contracts
        run: |
          set -euo pipefail
          mkdir -p preservation-tests
          timeout --signal=TERM --kill-after=30s 10m python -m pytest -q .github/tests --junitxml=preservation-tests/tests.xml
      - name: Prove actual private draft upload, download and full restore
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 5m python -m simulation.stage_0_6_preserve_fixtures smoke --output preservation-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fixture-preservation-smoke-${{ github.sha }}
          path: |
            preservation-tests/*.xml
            preservation-smoke/**/*.json
          if-no-files-found: error
          retention-days: 90
  preserve:
    needs: smoke
    if: github.event_name == 'push' || inputs.mode == 'preserve'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Validate explicit authorized request
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          value=json.load(open('simulation/stage_0_6_fixture_preservation_request.json'))
          assert value['schema']=='ate-fixture-preservation-request/1'
          assert value['operation']=='private-draft-preserve-and-verify-restoration'
          assert value['approved_plan']=='2026-11-15-forensic-repair'
          PY
      - name: Preserve exact pinned inputs and verify complete restored ZIPs
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 130m python -m simulation.stage_0_6_preserve_fixtures preserve --output preservation-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fixture-preservation-${{ github.sha }}
          path: preservation-evidence/**/*.json
          if-no-files-found: error
          retention-days: 90
