name: Hot working set validation

# Candidate includes pinned membership-query reuse.

on:
  push:
    branches:
      - sol-stage-0-5-hot-working-set

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Focused store and lazy regressions
        run: |
          python -m pytest -q             simulation/tests/test_persistence_lazy_store.py             simulation/tests/test_persistence_lazy_store_failures.py             simulation/tests/test_persistence_lazy_people.py             simulation/tests/test_persistence_lazy_social.py             simulation/tests/test_persistence_lazy_materials.py             simulation/tests/test_persistence_lazy_currency.py             simulation/tests/test_persistence_lazy_identity.py
      - name: Profile integrated lazy simulation
        run: |
          python - <<'PY'
          import cProfile
          import pstats
          import tempfile
          import time
          from pathlib import Path

          from ate_sim.engine import Simulation
          from ate_sim.persistence_lazy import convert_cold_to_lazy, open_lazy_world_session
          from ate_sim.persistence_session import write_cold_snapshot
          from ate_sim.worldgen import generate_world

          rules="hot-working-set-profile"
          with tempfile.TemporaryDirectory() as td:
              td=Path(td)
              cold=td/"cold.sqlite"
              lazy=td/"lazy.sqlite"
              source=generate_world(843000)
              Simulation(source).run(3)
              write_cold_snapshot(source,cold,rules_id=rules)
              convert_cold_to_lazy(cold,lazy,rules_id=rules)
              with open_lazy_world_session(lazy,rules_id=rules) as session:
                  session.store.reset_diagnostics()
                  prof=cProfile.Profile()
                  started=time.perf_counter()
                  prof.enable()
                  Simulation(session.world).run(7)
                  prof.disable()
                  elapsed=time.perf_counter()-started
                  diag=session.store.diagnostics()
                  print("PROFILE_SIM_SECONDS",elapsed)
                  print("PROFILE_PAYLOAD_READS",diag.payload_reads)
                  print("PROFILE_QUERY_ROWS",diag.query_rows)
                  print("PROFILE_PAYLOAD_CHECK_READS",diag.payload_check_reads)
                  pstats.Stats(prof).strip_dirs().sort_stats("cumtime").print_stats(40)
          PY
      - name: Integrated P5 dry benchmark
        run: |
          python simulation/persistence_p5_long_validation.py             --seed 843000             --milestones 4 7 10             --bootstrap-year 3             --workdir p5-hot-dry             --output p5-hot-dry.json             --product-sha "$GITHUB_SHA"             --workflow-sha "$GITHUB_SHA"
      - name: Print compact P5 metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("p5-hot-dry.json").read_text())
          print("control_wall_seconds", data["control_wall_seconds"])
          for year,row in sorted(data["p4"].items(), key=lambda item:int(item[0])):
              print(
                  year,
                  "simulation_seconds", row["simulation_seconds"],
                  "payload_reads", row["simulation_io"]["payload_reads"],
                  "save_seconds", row["save_seconds"],
                  "reopen_digest_seconds", row["reopen_digest_seconds"],
              )
          PY

      - name: Integrated P5 medium benchmark
        run: |
          python simulation/persistence_p5_long_validation.py \
            --seed 843000 \
            --milestones 25 50 100 \
            --bootstrap-year 3 \
            --workdir p5-hot-medium \
            --output p5-hot-medium.json \
            --product-sha "$GITHUB_SHA" \
            --workflow-sha "$GITHUB_SHA"
      - name: Print compact medium metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("p5-hot-medium.json").read_text())
          print("MEDIUM_CONTROL", data["control_wall_seconds"])
          for year,row in sorted(data["p4"].items(), key=lambda item:int(item[0])):
              print(
                  year,
                  "simulation_seconds", row["simulation_seconds"],
                  "payload_reads", row["simulation_io"]["payload_reads"],
                  "save_seconds", row["save_seconds"],
                  "reopen_digest_seconds", row["reopen_digest_seconds"],
              )
          PY
