name: Stage 0.5 durable continuation proof - mature paused
# Validate JSON year-key comparison repair; retained mature save1001 is immutable.
'on':
  push:
    branches: [sol/stage-0-5-continuation-checkpoints]
    paths: [.github/workflows/stage-0-5-continuation-proof.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-0-5-continuation-proof
  cancel-in-progress: false
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
  RUNTIME_SHA: 2cbf3510ef1f0ad8ddd712a1c4174ccfa518291a
  HARNESS_SHA: ${{ github.sha }}
jobs:
  harness-tests:
    name: harness-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.HARNESS_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install pytest pyyaml
    - name: Local protocol and transport tests
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p evidence
        timeout --signal=TERM --kill-after=30s 25m python -m pytest -q \
          simulation/tests/test_continuation_receipts.py \
          simulation/tests/test_continuation_checkpoint.py \
          simulation/tests/test_continuation_verifiers.py \
          simulation/tests/test_continuation_acceptance.py \
          simulation/tests/test_continuation_restore.py \
          simulation/tests/test_construction_mature_continuation_stages.py \
          simulation/tests/test_continuation_checkpoint_ci.py \
          simulation/tests/test_long_history_report_treasuries.py \
          simulation/tests/test_checkpoint_artifacts.py \
          --junitxml=evidence/protocol-tests.xml 2>&1 | tee evidence/protocol-tests.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: continuation-checkpoints-tests
        path: evidence
        retention-days: 14
  full-suite:
    name: full-suite
    needs: [harness-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.HARNESS_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install pytest pyyaml
    - name: Full simulation suite
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p evidence
        timeout --signal=TERM --kill-after=30s 135m python -m pytest -q simulation/tests \
          --junitxml=evidence/full-suite.xml 2>&1 | tee evidence/full-suite.log
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: continuation-checkpoints-full-suite
        path: evidence
        retention-days: 14
  source:
    name: source
    needs: [harness-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.HARNESS_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install pytest pyyaml
    - name: Execute bounded stage
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p evidence
        timeout --signal=TERM --kill-after=30s 20m python -m simulation.continuation_checkpoint_ci --job source 2>&1 | tee evidence/source.log
    - name: Retain diagnostics
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: continuation-small-source-diagnostics
        path: evidence/source.log
        retention-days: 14
    - name: Retain completed stage
      uses: actions/upload-artifact@v4
      with:
        name: continuation-small-source
        path: evidence/source/output
        if-no-files-found: error
        retention-days: 14
        compression-level: 1
  save1:
    name: save1
    needs: [source]
