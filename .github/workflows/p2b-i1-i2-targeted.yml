name: p2b-i1-i2-full
on:
  push:
    branches: [sol/p2b-i1-i2]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: one full unit/integration suite
        run: pytest -q simulation/tests
