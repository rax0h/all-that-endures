name: P4.2 hybrid exact repro

on:
  push:
    branches:
      - sol-p4-2-hybrid-exact-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: PYTHONPATH=simulation:. python -m pytest -q simulation/tests/test_persistence_lazy_people.py::test_people_scalar_edit_save_reopen_and_true_noop simulation/tests/test_persistence_lazy_people.py::test_hybrid_lazy_session_runs_one_real_step_and_reopens_equal_to_eager_control
