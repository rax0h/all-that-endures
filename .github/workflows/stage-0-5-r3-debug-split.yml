name: stage-0-5-r3-debug-split
on:
  push:
    branches: [sim/stage-0-5-r3-debug-split]
jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - run: python -m pytest -vv -q simulation/tests/test_stage_0_5_paged_household_world.py::test_r3_split_shared_member_list_on_one_household
# retest checked incarnation precedence
# identity-path diagnostic
