name: Stage 0.6 save and warm-year diagnostic
'on':
  push:
    branches: [sol/durable-proof-map]
    paths: [docs/performance/stage-0-6-current/small-operation-profile/successor-probe-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-0-6-successor-operation-profile-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  profile:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - run: python -m pip install pyyaml==6.0.3
      - name: Profile exact small operations and verify saved continuation
        run: timeout --signal=TERM --kill-after=15s 6m python docs/performance/stage-0-6-current/small-operation-profile/successor_probe.py evidence
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 3
        with:
          name: stage-0-6-successor-operation-profile-${{ github.sha }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
