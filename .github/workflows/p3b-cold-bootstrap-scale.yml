name: p3b-cold-bootstrap-scale
on:
  push:
    branches: [sol/p3b-cold-bootstrap-scale]
jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q -s simulation/tests/test_persistence_cold_bootstrap.py -k transfer_read_and_retention_bounds
