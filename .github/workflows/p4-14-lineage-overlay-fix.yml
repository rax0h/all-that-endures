name: P4.14 lineage overlay fix

on:
  push:
    branches:
      - sol-p4-14-lineage-overlay-fix

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python -m pytest -q \
            simulation/tests/test_persistence_lazy_lineage.py \
            simulation/tests/test_persistence_lazy_people.py::test_hybrid_lazy_session_runs_one_real_step_and_reopens_equal_to_eager_control \
            simulation/tests/test_persistence_lazy_people.py::test_hybrid_lazy_session_continues_two_real_steps_across_reopen
