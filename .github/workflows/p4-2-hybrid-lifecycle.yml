name: P4.2 hybrid lifecycle gate

on:
  push:
    branches:
      - sol-p4-2-hybrid-lifecycle-gate

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m py_compile simulation/ate_sim/persistence_tracking.py simulation/ate_sim/persistence_session.py simulation/ate_sim/persistence_events.py simulation/ate_sim/persistence_cold_save.py simulation/ate_sim/persistence_lazy.py simulation/tests/test_persistence_lazy_people.py
      - run: PYTHONPATH=simulation:. python -m pytest -q simulation/tests/test_persistence_lazy_people.py simulation/tests/test_persistence_lazy_identity.py simulation/tests/test_persistence_lazy_store.py simulation/tests/test_persistence_lazy_store_failures.py simulation/tests/test_persistence_cold_save.py simulation/tests/test_persistence_cold_save_bounds.py simulation/tests/test_persistence_cold_save_failures.py simulation/tests/test_persistence_cold_bootstrap.py simulation/tests/test_persistence_session_open.py simulation/tests/test_persistence_event_log.py
