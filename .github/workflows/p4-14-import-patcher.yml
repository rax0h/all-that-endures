name: P4.14 import patcher

on:
  push:
    branches:
      - sol-p4-14-import-patcher

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "OpenAI Sol"
          git config user.email "actions@users.noreply.github.com"
          git checkout sim/stage-0-5-stabilization
          python -c 'from pathlib import Path; p=Path("simulation/ate_sim/persistence_lazy.py"); c=p.read_text(); old="from .lineage import LineageNode\\n"; new="from .lineage import LineageNode\\nfrom .persistence_lazy_lineage_children import (\\n    LINEAGE_CHILD_NAMESPACE,\\n    LINEAGE_CHILD_EDGE_NAMESPACE,\\n    LAZY_LINEAGE_CHILD_SCHEMA,\\n    LAZY_LINEAGE_CHILD_EDGE_SCHEMA,\\n    LazyLineageChildrenTable,\\n    LazyLineageTrackedSet,\\n    insert_lineage_child_bucket,\\n    insert_lineage_child_edge,\\n)\\n"; assert old in c; p.write_text(c.replace(old,new,1))'
          git add simulation/ate_sim/persistence_lazy.py
          git commit -m "Import P4.14 lineage child adapter [skip ci]"
          git push origin HEAD:sim/stage-0-5-stabilization
