name: stage-0-5-r3-independent-gates
on:
  push:
    branches: [sim/stage-0-5-r3-independent-gates]
jobs:
  independent-p5:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Independent P5 continuation with R3 pages enabled
        run: python simulation/persistence_p5_validation.py --seed 843000 --pre-years 3 --continuation-years 4 --reopen-years 3 --paged-households --output /tmp/r3-p5-short.json
      - name: Bounded combined storage and identity checks
        run: python -m pytest -q simulation/tests/test_stage_0_5_household_sequence.py simulation/tests/test_stage_0_5_paged_household_world.py simulation/tests/test_persistence_lazy_identity.py simulation/tests/test_persistence_lazy_people.py simulation/tests/test_persistence_lifecycle.py
