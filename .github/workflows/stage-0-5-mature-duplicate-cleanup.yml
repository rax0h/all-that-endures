name: Stop duplicate mature construction
'on':
  push:
    branches:
    - sol/stage-0-5-mature-checkpoint-validation
    paths:
    - .github/workflows/stage-0-5-mature-duplicate-cleanup.yml
permissions:
  contents: read
  actions: write
jobs:
  stop-duplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Cancel only the confirmed duplicate
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python - <<'PYTHON'\nimport json,os,urllib.request\nbase='https://api.github.com/repos/rax0h/all-that-endures/actions/runs/'\n\
        headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}\n\
        def read(run_id):\n    with urllib.request.urlopen(urllib.request.Request(base+str(run_id),headers=headers),timeout=60)\
        \ as response:\n        return json.load(response)\nkeep=read(38762444566)\n\
        duplicate=read(38762492433)\nfor row in (keep,duplicate):\n    assert row['head_sha']=='38369b86e3accc6f6dc361f8b7b65dd053d39609'\n\
        \    assert row['head_branch']=='sol/stage-0-5-mature-checkpoint-validation'\n\
        \    assert row['path']=='.github/workflows/stage-0-5-mature-capture.yml'\n\
        if duplicate['status']=='completed':\n    print('Duplicate already stopped:',duplicate['conclusion'])\n\
        elif keep['status']=='in_progress' or keep.get('conclusion')=='success':\n\
        \    request=urllib.request.Request(base+'38762492433/cancel',headers=headers,method='POST')\n\
        \    with urllib.request.urlopen(request,timeout=60) as response:\n      \
        \  print('Cancel request accepted for duplicate38762492433:',response.status)\n\
        else:\n    print('Primary is not healthy; leaving other run active:',keep['status'],keep.get('conclusion'))\n\
        print('Primary run38762444566:',keep['status'],keep.get('conclusion'))\nPYTHON"
