name: P4 integrated full suite

on:
  push:
    branches:
      - sol-p4-integrated-full-suite

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: PYTHONPATH=simulation:. python -m pytest -q simulation/tests
