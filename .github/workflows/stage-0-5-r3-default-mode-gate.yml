name: stage-0-5-r3-default-mode-gate
on:
  push:
    branches: [sim/stage-0-5-r3-default-mode]
jobs:
  default-and-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Default bounded R3 and legacy compatibility
        run: python -m pytest -q simulation/tests/test_stage_0_5_r3_default_mode.py simulation/tests/test_stage_0_5_closeout.py -k "r3_household or default_conversion or unpaged_legacy"
      - name: P2C split, cross-family aliases and recovery
        run: python -m pytest -q simulation/tests/test_stage_0_5_paged_household_world.py simulation/tests/test_stage_0_5_r3_cross_family_extra.py simulation/tests/test_stage_0_5_r3_recovery_extra.py
  legacy-affected:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Existing ordinary default callers and lifecycle regressions
        run: python -m pytest -q simulation/tests/test_persistence_lazy_people.py simulation/tests/test_persistence_lazy_identity.py simulation/tests/test_persistence_lazy_genealogy.py simulation/tests/test_persistence_lazy_currency.py simulation/tests/test_persistence_lifecycle.py
      - name: Independent P5 default conversion and open
        run: python simulation/persistence_p5_validation.py --seed 843000 --pre-years 3 --continuation-years 4 --reopen-years 3 --output /tmp/stage-0-5-default-p5.json
