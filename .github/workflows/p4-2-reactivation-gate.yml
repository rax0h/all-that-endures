name: P4.2 reactivation gate

on:
  push:
    branches:
      - sol-p4-2-reactivation-gate

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: PYTHONPATH=simulation:. python -m pytest -q simulation/tests/test_persistence_lazy_people.py::test_evicted_inactive_person_reactivation_invalidates_alive_query_and_reopens
