name: P4.2 hybrid broader affected gate

on:
  push:
    branches:
      - sol-p4-2-hybrid-broad-gate

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python -m pytest -q \
            simulation/tests/test_persistence_cold_bootstrap.py \
            simulation/tests/test_persistence_cold_capture.py \
            simulation/tests/test_persistence_cold_identity_restore.py \
            simulation/tests/test_persistence_cold_save.py \
            simulation/tests/test_persistence_cold_save_bounds.py \
            simulation/tests/test_persistence_cold_save_failures.py \
            simulation/tests/test_persistence_event_identity.py \
            simulation/tests/test_persistence_event_log.py \
            simulation/tests/test_persistence_lazy_identity.py \
            simulation/tests/test_persistence_lazy_people.py \
            simulation/tests/test_persistence_lazy_store.py \
            simulation/tests/test_persistence_lazy_store_failures.py \
            simulation/tests/test_persistence_lifecycle.py \
            simulation/tests/test_persistence_session_open.py \
            simulation/tests/test_persistence_tracking.py
