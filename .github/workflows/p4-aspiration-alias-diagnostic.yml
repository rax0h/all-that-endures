name: P4 aspiration alias diagnostic
on:
  push:
    branches: [sol-p4-cross-boundary-aspiration-debug]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce and inspect save plan
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import weakref
          from ate_sim.core import World
          from ate_sim.magic_resources import MagicAspiration
          from ate_sim.persistence_lazy import convert_cold_to_lazy, open_lazy_world_session
          from ate_sim.persistence_session import write_cold_snapshot

          RULES="stage-0.5-p4-lazy-aspiration-tests"
          def aspiration(value=0.5):
              return MagicAspiration(value,3,20,"curiosity",0,urgency=0.4)

          with TemporaryDirectory() as td:
              td=Path(td)
              world=World(843000)
              for pid in range(1,5):
                  world.magic_resources.aspirations[pid]=aspiration((pid%10)/10)
              shared=world.magic_resources.aspirations[1]
              world.currency.wallets[99]={"aspiration":shared}
              source=td/"cold.sqlite"; dest=td/"lazy.sqlite"
              write_cold_snapshot(world,source,rules_id=RULES)
              convert_cold_to_lazy(source,dest,rules_id=RULES)
              with open_lazy_world_session(dest,rules_id=RULES) as session:
                  table=session.world.magic_resources.aspirations
                  eager=session.world.currency.wallets[99]["aspiration"]
                  ref=eager.__dict__.get("_index_table")
                  print("before", table.diagnostics(), "index_table_is_asp=", ref is not None and ref() is table)
                  eager.preparation=0.88
                  print("after_mut", table.diagnostics(), "resident", dict.__contains__(table,1), "value", eager.preparation)
                  changes=table.prepare_save_changes()
                  print("table_plan", "versions", len(changes[0]), "identity", len(changes[1]), "touched", changes[2], "structural", changes[3])
                  if changes[0]:
                      print("planned_value", changes[0][0].value.preparation)
                  plan=session._prepare_hybrid_save()
                  print("hybrid", plan is not None, "asp_versions", 0 if plan is None else len(plan.aspiration_version_changes), "asp_touched", () if plan is None else plan.aspiration_touched_keys)
          PY
