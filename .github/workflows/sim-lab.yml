name: sim-lab

on:
  pull_request:
  push:
    branches:
      - cursor/simulation-laboratory-54c5

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install laboratory dependencies
        run: python -m pip install -r tools/sim-lab/requirements.txt -r tools/sim-lab/requirements-dev.txt
      - name: Laboratory tests
        run: python -m pytest -q tools/sim-lab/tests
