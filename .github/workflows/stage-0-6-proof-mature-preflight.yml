name: Stage 0.6 mature proof fixture preflight
'on':
  workflow_dispatch:
  push:
    branches: [sol/durable-proof-map]
    paths: [simulation/stage_0_6_proof_mature_request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-0-6-proof-mature-preflight
  cancel-in-progress: false
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Targeted inventory and retained authority gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m pytest -q .github/tests/test_stage_0_6_proof_mature_preflight.py .github/tests/test_stage_0_6_retained_archive.py .github/tests/test_stage_0_6_retained_producer.py .github/tests/test_stage_0_6_retained_transport.py .github/tests/test_stage_0_6_retained_launch.py -o junit_family=legacy --junitxml=evidence/harness.xml 2>&1 | tee evidence/harness.log
      - name: Reserve disposable runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell
          sudo docker image prune -af
          df -h . > evidence/disk-start.txt
      - name: Authenticate retained input and inventory without World restoration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          timeout --signal=TERM --kill-after=30s 35m python -m simulation.stage_0_6_proof_mature_preflight run --root "$GITHUB_WORKSPACE" --config simulation/stage_0_6_proof_mature_request.json 2>&1 | tee evidence/preflight.log || status=$?
          python -m simulation.stage_0_6_proof_mature_preflight record-exit --root "$GITHUB_WORKSPACE" --status "$status"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-0-6-proof-mature-preflight-${{ github.sha }}
          path: |
            evidence/**/*.json
            evidence/**/*.xml
            evidence/**/*.log
            evidence/disk-start.txt
          retention-days: 30
          if-no-files-found: error
