name: Stage 0.5 household owner-scoped index proof
'on':
  push:
    branches:
      - sim/stage-0-5-household-scoped-index
    paths:
      - .github/workflows/stage-0-5-household-scoped-index.yml
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install -q pytest
      - name: Focused scoped-index and prior household/people regressions
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short \
            simulation/tests/test_stage_0_5_household_scoped_index.py \
            simulation/tests/test_stage_0_5_household_living_selection.py \
            simulation/tests/test_stage_0_5_household_sequence.py \
            simulation/tests/test_stage_0_5_paged_household_world.py \
            simulation/tests/test_persistence_lazy_people.py > household-index-focus.log 2>&1
          FOCUSED_RC=$?
          cat household-index-focus.log
          python simulation/persistence_p5_validation.py \
            --seed 843000 --pre-years 3 --continuation-years 4 \
            --reopen-years 3 --paged-households \
            --output household-index-p5.json > household-index-p5.log 2>&1
          P5_RC=$?
          cat household-index-p5.log
          echo "FOCUSED_RC=$FOCUSED_RC" >> "$GITHUB_ENV"
          echo "P5_RC=$P5_RC" >> "$GITHUB_ENV"
          exit 0
      - name: Retain exact focused and short-continuation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: household-scoped-index-evidence
          retention-days: 30
          path: |
            household-index-focus.log
            household-index-p5.log
            household-index-p5.json
          if-no-files-found: warn
      - name: Publish exact-source test result on isolated branch
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          focus=Path("household-index-focus.log").read_text()
          try:
              p5=json.loads(Path("household-index-p5.json").read_text())
          except (ValueError, OSError):
              p5=None
          report={
              "tested_commit":os.environ["GITHUB_SHA"],
              "workflow_run":os.environ["GITHUB_RUN_ID"],
              "focused_exit_code":int(os.environ["FOCUSED_RC"]),
              "focused_summary":focus.strip().splitlines()[-1] if focus.strip() else "",
              "p5_exit_code":int(os.environ["P5_RC"]),
              "p5_passed":bool(isinstance(p5,dict) and p5.get("passed") is True),
              "p5_final_year":p5.get("final_year") if isinstance(p5,dict) else None,
              "note":"Tests apply to tested_commit only; independent full-suite gate remains pending."
          }
          Path("simulation/household_scoped_index_ci_result.json").write_text(
              json.dumps(report,sort_keys=True,indent=2)+"\n"
          )
          print(report)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation/household_scoped_index_ci_result.json
          git commit -m "ci: record exact household scoped-index proof [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          python - <<'PY'
          import json, sys
          from pathlib import Path
          r=json.loads(Path("simulation/household_scoped_index_ci_result.json").read_text())
          if r["focused_exit_code"] or r["p5_exit_code"] or not r["p5_passed"]:
              sys.exit("focused or P5 gate failed")
          PY
