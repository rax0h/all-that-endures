name: p3b-cold-save-review-final-validation
on:
  push:
    branches: [sol/p3b-cold-save-review-fixes]
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: affected persistence identity eventlog lifecycle
        run: >
          python -m pytest -q
          simulation/tests/test_incremental_store.py
          simulation/tests/test_persistence*.py
          simulation/tests/test_cold_history.py
          simulation/tests/test_event_year_queries.py
          simulation/tests/test_canonical_digest.py
          simulation/tests/test_history_archive.py
      - name: full simulation tests
        if: always()
        run: python -m pytest -q simulation/tests
