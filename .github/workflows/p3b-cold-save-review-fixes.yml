name: p3b-cold-save-review-focused
on:
  push:
    branches: [sol/p3b-cold-save-review-fixes]
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: focused cold-save correction suite
        run: >
          python -m pytest -q -s
          simulation/tests/test_persistence_cold_save.py
          simulation/tests/test_persistence_cold_save_failures.py
          simulation/tests/test_persistence_cold_save_bounds.py
