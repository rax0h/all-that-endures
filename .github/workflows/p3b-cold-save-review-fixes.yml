name: p3b-cold-save-review-fixes-v2
on:
  push:
    branches: [sol/p3b-cold-save-review-fixes]
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: review blocker reproductions
        run: >
          python -m pytest -q -s
          simulation/tests/test_persistence_cold_save_bounds.py::test_local_edit_does_not_copy_unrelated_persisted_keys
          simulation/tests/test_persistence_cold_save_bounds.py::test_cold_save_local_alias_work_is_affected_owner_bounded
          simulation/tests/test_persistence_cold_save_failures.py::test_failure_after_journal_cleanup_resolves_idempotently
          simulation/tests/test_persistence_cold_save_failures.py::test_publication_failure_before_adoption_resolves_once
          simulation/tests/test_persistence_cold_save_failures.py::test_publication_failure_after_adoption_resolves_idempotently
