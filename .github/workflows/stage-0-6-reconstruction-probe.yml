name: Stage 0.6 isolated reconstruction
'on':
  push:
    branches: [sol/durable-proof-map]
    paths:
      - docs/performance/stage-0-6-current/reconstruction-probe-request.json

permissions:
  contents: read
  actions: read
concurrency:
  group: stage-0-6-isolated-reconstruction-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
  PROBE: docs/performance/stage-0-6-current/reconstruction_probe.py

jobs:
  small:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Install pinned admission dependency
        run: python -m pip install pyyaml==6.0.3
      - name: Validate comparison and interruption handling
        run: python -m unittest discover -s docs/performance/stage-0-6-current -p test_reconstruction_probe.py -v
      - name: Prove interruption and restart on the admitted small input
        shell: bash
        run: |
          set -euo pipefail
          status=0
          timeout --signal=TERM --kill-after=15s 6m python "$PROBE" --mode smoke --component scope \
            --output evidence/interrupted --interrupt-after-first || status=$?
          test "$status" -eq 77
          timeout --signal=TERM --kill-after=15s 7m python "$PROBE" --mode smoke --component scope --output evidence/scope
          timeout --signal=TERM --kill-after=15s 7m python "$PROBE" --mode smoke --component collection --output evidence/collection
          python - <<'PY'
          import json
          from pathlib import Path
          def read(trial, name):
              return json.loads((Path('evidence') / trial / (name + '.json')).read_bytes())
          cut = read('interrupted', 'result')
          scope = read('scope', 'result')
          collection = read('collection', 'result')
          assert cut['status'] == 'interrupted' and cut['roots'] is None
          assert not Path('evidence/interrupted/repeat.json').exists()
          assert scope['status'] == collection['status'] == 'complete'
          assert all(result['parent_verified'] is True for result in (cut, scope, collection))
          assert cut['database_sha256'] == scope['database_sha256'] == collection['database_sha256']
          assert read('interrupted', 'first') == read('scope', 'first') == read('scope', 'repeat') == scope['roots']
          assert read('collection', 'first') == read('collection', 'repeat') == collection['roots']
          assert [root['count'] for root in scope['roots']] == [650, 1369, 243, 775, 420, 8, 2]
          assert [root['count'] for root in collection['roots']] == [69]
          PY
      - name: Publish small diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: small-evidence
        timeout-minutes: 3
        with:
          name: reconstruction-small-evidence-${{ github.run_attempt }}
          path: evidence/**/*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Download and verify the actual small evidence artifact
        shell: bash
        timeout-minutes: 3
        env:
          ARTIFACT_ID: ${{ steps.small-evidence.outputs.artifact-id }}
          ARTIFACT_SHA256: ${{ steps.small-evidence.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/reconstruction-small.zip"
          downloaded=false
          for delay in 0 1 2 4 8; do
            sleep "$delay"
            if timeout --kill-after=5s 15s gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$archive"; then
              downloaded=true
              break
            fi
          done
          test "$downloaded" = true
          printf '%s  %s\n' "$ARTIFACT_SHA256" "$archive" | sha256sum --check
          python -m zipfile -e "$archive" downloaded-small
      - run: diff -r evidence downloaded-small

  mature:
    needs: small
    runs-on: ubuntu-26.04
    timeout-minutes: 185
    strategy:
      fail-fast: false
      matrix:
        component: [scope, collection]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Install pinned admission dependency
        run: python -m pip install pyyaml==6.0.3
      - name: Reserve disposable runner disk before restore
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/swift /usr/local/.ghcup /usr/local/share/powershell
          sudo docker image prune -af
          df -h .
      - name: Measure first and repeated construction on the retained database
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          timeout --signal=TERM --kill-after=30s 165m python "$PROBE" \
            --mode mature --component "$COMPONENT" --output evidence
      - name: Preserve completed or partial diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 5
        with:
          name: reconstruction-mature-${{ matrix.component }}-evidence-${{ github.run_attempt }}
          path: evidence/*.json
          retention-days: 30
          if-no-files-found: warn
