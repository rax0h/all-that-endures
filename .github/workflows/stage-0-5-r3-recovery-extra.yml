name: stage-0-5-r3-recovery-extra
on:
  push:
    branches: [sim/stage-0-5-r3-recovery-gate]
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - name: Fault/recovery/stale writer cases
        run: python -m pytest -vv -q simulation/tests/test_stage_0_5_r3_recovery_extra.py
