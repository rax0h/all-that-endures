name: P4.5 soul affected gate

on:
  push:
    branches:
      - sol-p4-5-soul-affected-gate

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python -m pytest -q \
            simulation/tests/test_persistence_lazy_souls.py \
            simulation/tests/test_metaphysics_divinity.py \
            simulation/tests/test_persistence_lazy_people.py \
            simulation/tests/test_persistence_lazy_identity.py \
            simulation/tests/test_persistence_lazy_store.py \
            simulation/tests/test_persistence_lazy_store_failures.py \
            simulation/tests/test_persistence_lazy_resources.py \
            simulation/tests/test_persistence_lazy_materials.py \
            simulation/tests/test_persistence_lazy_currency.py \
            simulation/tests/test_persistence_lifecycle.py \
            simulation/tests/test_persistence_session_open.py
