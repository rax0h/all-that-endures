name: p3b-lifecycle-final-validation
on:
  push:
    branches:
      - sol/p3b-lifecycle-candidate
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: affected lifecycle and persistence suite
        run: python -m pytest -q -s simulation/tests/test_incremental_store.py simulation/tests/test_persistence_lifecycle.py simulation/tests/test_persistence_history_operations.py simulation/tests/test_persistence_cold_save.py simulation/tests/test_persistence_cold_save_failures.py simulation/tests/test_persistence_cold_save_bounds.py simulation/tests/test_persistence_session_open.py simulation/tests/test_persistence_event_log.py simulation/tests/test_persistence_events.py simulation/tests/test_cold_history.py simulation/tests/test_event_year_queries.py simulation/tests/test_canonical_digest.py simulation/tests/test_history_archive.py
      - name: full simulation tests
        if: always()
        run: python -m pytest -q -s simulation/tests
