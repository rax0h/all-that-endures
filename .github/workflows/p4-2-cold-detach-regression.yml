name: P4.2 cold detach regression

on:
  push:
    branches:
      - sol-p4-2-cold-detach-regression

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: PYTHONPATH=simulation:. python -m pytest -q simulation/tests/test_persistence_lifecycle.py -k "detach"
