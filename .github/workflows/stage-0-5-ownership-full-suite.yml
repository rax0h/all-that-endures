name: Stage 0.5 ownership repair - one full suite
'on':
  push:
    branches:
    - sol/stage-0-5-ownership-gate-171b183
    paths:
    - .github/workflows/stage-0-5-ownership-full-suite.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: .:simulation
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pytest
      run: python -m pip install -q pytest
    - name: Verify frozen source and restore exact focused evidence
      run: |
        python - <<'PY'
        import base64, datetime, hashlib, json, os, platform, sqlite3, subprocess, sys
        from pathlib import Path
        import pytest
        payload = {'candidate-files.txt': '', 'focused.log': '', 'local-provenance.json': '', 'ownership-p5.json': '', 'p5.log': ''}
        out = Path('ownership-gate-evidence')
        out.mkdir(exist_ok=False)
        for name, encoded in payload.items():
            (out / name).write_bytes(base64.b64decode(encoded, validate=True))
        local = json.loads((out / 'local-provenance.json').read_text())
        for name, expected in local['files'].items():
            data = (out / name).read_bytes()
            assert len(data) == expected['bytes'], name
            assert hashlib.sha256(data).hexdigest() == expected['sha256'], name
        assert local['focused_and_p5_passed'] is True
        assert all(gate['exit_code'] == 0 for gate in local['gates'])
        assert json.loads((out / 'ownership-p5.json').read_text())['passed'] is True
        def git(*args):
            return subprocess.check_output(['git', *args], text=True).strip()
        candidate = local['candidate_commit']
        assert git('rev-parse', 'HEAD^') == candidate
        assert git('rev-parse', candidate + '^{tree}') == local['candidate_tree']
        assert git('diff', '--name-only', candidate, 'HEAD') == '.github/workflows/stage-0-5-ownership-full-suite.yml'
        for path, field in [('simulation', 'simulation_tree'),
                            ('simulation/ate_sim', 'implementation_tree'),
                            ('simulation/tests', 'tests_tree')]:
            assert git('rev-parse', 'HEAD:' + path) == local[field]
        manifest = dict(local)
        manifest.pop('full_suite_status', None)
        manifest['ci'] = {
            'helper_commit': git('rev-parse', 'HEAD'),
            'helper_tree': git('rev-parse', 'HEAD^{tree}'),
            'workflow_path': '.github/workflows/stage-0-5-ownership-full-suite.yml',
            'workflow_blob': git('rev-parse', 'HEAD:.github/workflows/stage-0-5-ownership-full-suite.yml'),
            'workflow_sha256': hashlib.sha256(Path('.github/workflows/stage-0-5-ownership-full-suite.yml').read_bytes()).hexdigest(),
            'candidate_and_helper_simulation_trees_equal': True,
            'helper_diff_is_workflow_only': True,
            'event': os.environ['GITHUB_EVENT_NAME'],
            'run_id': os.environ['GITHUB_RUN_ID'],
            'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'run_url': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
            'python': sys.version, 'pytest': pytest.__version__,
            'sqlite': sqlite3.sqlite_version, 'platform': platform.platform(),
        }
        manifest['full_suite'] = {'command': ['python', '-m', 'pytest', '-q', 'simulation/tests'],
                                  'status': 'not_started', 'exit_code': None}
        (out / 'provenance-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
        print(json.dumps(manifest['ci'], indent=2))
        PY
    - name: Retain preflight evidence before the full suite
      uses: actions/upload-artifact@v4
      with:
        name: ownership-preflight-${{ github.run_id }}
        path: ownership-gate-evidence/
        if-no-files-found: error
        retention-days: 90
    - name: Run exactly one complete simulation test suite
      shell: bash
      run: |
        python - <<'PY'
        import datetime, json
        from pathlib import Path
        path = Path('ownership-gate-evidence/provenance-manifest.json')
        manifest = json.loads(path.read_text())
        manifest['full_suite']['started_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
        manifest['full_suite']['status'] = 'running'
        path.write_text(json.dumps(manifest, indent=2) + '\n')
        PY
        set +e
        python -m pytest -q simulation/tests 2>&1 | tee ownership-gate-evidence/full-suite.log
        pytest_status=${PIPESTATUS[0]}
        printf '%s\n' "$pytest_status" > ownership-gate-evidence/full-suite-exit-code.txt
        exit "$pytest_status"
    - name: Record full-suite result and evidence hashes
      if: always()
      run: |
        python - <<'PY'
        import datetime, hashlib, json
        from pathlib import Path
        out = Path('ownership-gate-evidence')
        path = out / 'provenance-manifest.json'
        if path.exists():
            manifest = json.loads(path.read_text())
            result = manifest['full_suite']
            code_path = out / 'full-suite-exit-code.txt'
            result['finished_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
            if code_path.exists():
                result['exit_code'] = int(code_path.read_text())
                result['status'] = 'passed' if result['exit_code'] == 0 else 'failed'
                if 'started_at' in result:
                    result['elapsed_seconds'] = (datetime.datetime.fromisoformat(result['finished_at']) - datetime.datetime.fromisoformat(result['started_at'])).total_seconds()
            else:
                result['status'] = 'incomplete' if result['status'] == 'running' else 'not_started'
            log = out / 'full-suite.log'
            if log.exists():
                result['log_tail'] = log.read_text(errors='replace').splitlines()[-15:]
            manifest['artifact_files'] = {
                item.name: {'bytes': item.stat().st_size,
                            'sha256': hashlib.sha256(item.read_bytes()).hexdigest()}
                for item in sorted(out.iterdir()) if item.is_file() and item != path
            }
            path.write_text(json.dumps(manifest, indent=2) + '\n')
            print(json.dumps(result, indent=2))
        PY
    - name: Retain pytest log, focused log, P5 and provenance
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ownership-full-suite-${{ github.run_id }}
        path: ownership-gate-evidence/
        if-no-files-found: error
        retention-days: 90
