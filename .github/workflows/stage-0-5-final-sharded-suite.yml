name: Stage 0.5 final file-sharded suite

on:
  push:
    branches:
      - sol-stage-0-5-final-sharded-suite

jobs:
  full-suite-file-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .:simulation
      SHARD_COUNT: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Run complete test files assigned to shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import glob, os, subprocess, sys
          files = sorted(glob.glob("simulation/tests/test_*.py"))
          shard = int(os.environ["SHARD_INDEX"])
          count = int(os.environ["SHARD_COUNT"])
          selected = [path for i, path in enumerate(files) if i % count == shard]
          print(f"file shard {shard}/{count}: {len(selected)} of {len(files)} test files")
          if not selected:
              raise SystemExit("empty file shard")
          raise SystemExit(subprocess.call(
              [sys.executable, "-m", "pytest", "-q", *selected],
              env=os.environ,
          ))
          PY
