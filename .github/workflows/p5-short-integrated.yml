name: P5 short integrated validation

on:
  push:
    branches:
      - sol-p5-short-integrated

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python simulation/persistence_p5_validation.py             --seed 843000             --pre-years 3             --continuation-years 4             --reopen-years 3             --output p5-short.json
      - uses: actions/upload-artifact@v4
        with:
          name: p5-short-validation
          path: p5-short.json
