name: P4 resource detach gate 2

on:
  push:
    branches:
      - sol-p4-resource-detach-gate-2

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: PYTHONPATH=simulation:. python -m pytest -q simulation/tests/test_persistence_lazy_resources.py::test_resource_materializing_detach_is_portable
