name: P4.7 institutions scaling

on:
  push:
    branches:
      - sol-p4-7-institutions-scaling

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python - <<'PY'
          from pathlib import Path
          import tempfile
          from ate_sim.core import World
          from ate_sim.institutions import (
              MagicUserRecord, AdventureNotice, SocietyApplication,
          )
          from ate_sim.persistence_session import write_cold_snapshot
          from ate_sim.persistence_lazy import (
              convert_cold_to_lazy, open_lazy_world_session,
          )

          RULES="p4-7-institution-scaling"

          def build(n):
              w=World(847000+n)
              for i in range(1,n+1):
                  person = 1 if i <= 2 else i + 1000
                  w.institutions.magic_records[i]=MagicUserRecord(
                      i,person,1,0,("fire",),"c","C",
                      ("ability",),("Ability",),"full",i,
                  )
                  status = "open" if i == 1 else ("assigned" if i == 2 else "resolved")
                  w.institutions.notices[i]=AdventureNotice(
                      i,1,0,"danger",1,i,status=status,
                      assigned_to=(1 if i == 2 else None),
                      resolved_event=(None if i <= 2 else i),
                  )
                  passed = None if i == 1 else (True if i == 2 else False)
                  w.institutions.applications[i]=SocietyApplication(
                      i,"magic_society",person,1,0,True,
                      stage=("screening" if passed is None else ("passed" if passed else "failed")),
                      passed=passed,origin_event=i,
                      resolved_event=(None if passed is None else i),
                  )
              w.institutions.next_record=n+1
              w.institutions.next_notice=n+1
              w.institutions.next_application=n+1
              return w

          def measure(n):
              with tempfile.TemporaryDirectory() as td:
                  td=Path(td)
                  cold=td/"cold.sqlite"
                  lazy=td/"lazy.sqlite"
                  write_cold_snapshot(build(n),cold,rules_id=RULES)
                  convert_cold_to_lazy(cold,lazy,rules_id=RULES)
                  with open_lazy_world_session(lazy,rules_id=RULES) as s:
                      open_diag=s.store.diagnostics()
                      assert s.institution_magic_records.diagnostics()["payload_loads"] == 0
                      assert s.institution_notices.diagnostics()["payload_loads"] == 0
                      assert s.institution_applications.diagnostics()["payload_loads"] == 0

                      before=s.store.diagnostics()
                      records=s.world.institutions.records_for_person(1)
                      notices=s.world.institutions.active_notices()
                      latest=s.world.institutions.latest_application(1,"magic_society")
                      qualified=s.world.institutions.has_application(
                          1,"magic_society",qualified=True
                      )
                      after=s.store.diagnostics()
                      fixed_reads=after.payload_reads-before.payload_reads
                      fixed_bytes=after.payload_read_bytes-before.payload_read_bytes

                      s.store.reset_diagnostics()
                      s.world.institutions.notices[1].status="resolved"
                      s.save()
                      save_diag=s.store.diagnostics()

                      result={
                          "n":n,
                          "open_payload_reads":open_diag.payload_reads,
                          "open_payload_bytes":open_diag.payload_read_bytes,
                          "fixed_query_payload_reads":fixed_reads,
                          "fixed_query_payload_bytes":fixed_bytes,
                          "record_ids":[r.id for r in records],
                          "notice_ids":[r.id for r in notices],
                          "latest_application":latest.id,
                          "qualified":qualified,
                          "save_payload_writes":save_diag.payload_writes,
                          "save_payload_write_bytes":save_diag.payload_write_bytes,
                          "resident_magic_records":s.institution_magic_records.diagnostics()["resident_records"],
                          "resident_notices":s.institution_notices.diagnostics()["resident_records"],
                          "resident_applications":s.institution_applications.diagnostics()["resident_records"],
                      }
                      print("INST_AFTER",result)
                      return result

          small=measure(1000)
          large=measure(10000)
          assert small["open_payload_reads"] == large["open_payload_reads"]
          assert small["fixed_query_payload_reads"] == large["fixed_query_payload_reads"]
          assert small["record_ids"] == large["record_ids"] == [1,2]
          assert small["notice_ids"] == large["notice_ids"] == [1,2]
          assert small["latest_application"] == large["latest_application"] == 2
          assert small["qualified"] and large["qualified"]
          assert small["save_payload_writes"] == large["save_payload_writes"]
          assert large["resident_magic_records"] <= 2
          assert large["resident_notices"] <= 2
          assert large["resident_applications"] <= 1
          PY
