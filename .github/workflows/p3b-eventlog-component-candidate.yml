name: p3b-eventlog-component-candidate

on:
  push:
    branches: [sol/p3b-eventlog-component-candidate]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: focused component measurements
        run: python -m pytest -q -s simulation/tests/test_persistence_event_log.py
      - name: affected EventLog P3A persistence
        run: python -m pytest -q simulation/tests/test_incremental_store.py simulation/tests/test_persistence*.py simulation/tests/test_cold_history.py simulation/tests/test_event_year_queries.py simulation/tests/test_canonical_digest.py simulation/tests/test_history_archive.py
      - name: full unit integration suite
        run: python -m pytest -q simulation/tests
