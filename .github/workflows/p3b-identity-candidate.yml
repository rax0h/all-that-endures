name: p3b-identity-candidate

on:
  push:
    branches: [sol/p3b-identity-candidate]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: focused P3B identity and accepted EventLog
        run: >-
          python -m pytest -q -s
          simulation/tests/test_persistence_p3b_identity.py
          simulation/tests/test_persistence_event_log.py
          simulation/tests/test_persistence_tracking.py
          simulation/tests/test_persistence_p2b_identity_review.py
          simulation/tests/test_persistence_p2b_review_regressions.py
          simulation/tests/test_persistence_p2c.py
      - name: full simulation suite
        run: python -m pytest -q simulation/tests
