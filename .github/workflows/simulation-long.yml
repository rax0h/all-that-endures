name: simulation-long
on:
  push:
    branches: [main]
    paths: ['.github/workflows/simulation-long.yml']
  workflow_dispatch:
    inputs:
      seed:
        description: 'World seed'
        required: true
        default: '843000'
      years:
        description: 'Years to simulate'
        required: true
        default: '1000'
  schedule:
    - cron: '0 6 * * 0'

concurrency:
  group: simulation-long-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: unit and integration suite
        run: pytest -q simulation/tests
      - name: one-off regular 1000-year world-state run
        if: github.event_name == 'push'
        run: |
          python simulation/run_long_history.py 843000 1000
          python simulation/specific_test.py --seed 843000 --years 1000 --section all --pretty
      - name: requested long history
        if: github.event_name == 'workflow_dispatch'
        run: python simulation/run_long_history.py ${{ inputs.seed }} ${{ inputs.years }}
      - name: weekly 1000-year validation
        if: github.event_name == 'schedule'
        run: python simulation/run_long_history.py 843000 1000
