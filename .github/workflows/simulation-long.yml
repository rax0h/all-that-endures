name: simulation-long
on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'World seed'
        required: true
        default: '843000'
      years:
        description: 'Years to simulate'
        required: true
        default: '1000'
  schedule:
    - cron: '0 6 * * 0'
  push:
    branches: [main, sim/ranked-threat-ecology]
    paths: ['simulation/**', '.github/workflows/simulation-long.yml']

concurrency:
  group: simulation-long-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: unit and integration suite
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: pytest -q simulation/tests
      - name: multi-seed calibration
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: python simulation/calibration_check.py
      - name: requested long history
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          /usr/bin/time -f 'elapsed_seconds=%e' python simulation/run_long_history.py ${{ inputs.seed }} ${{ inputs.years }} | tee long-history-report.jsonl
      - name: focused millennium benchmark
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          /usr/bin/time -f 'elapsed_seconds=%e' python simulation/run_long_history.py 843000 1000 | tee long-history-report.jsonl
      - name: weekly 1000-year validation
        if: github.event_name == 'schedule'
        run: |
          set -o pipefail
          /usr/bin/time -f 'elapsed_seconds=%e' python simulation/run_long_history.py 843000 1000 | tee long-history-report.jsonl
      - name: retain long-history diagnostics
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: long-history-diagnostics-${{ github.run_number }}
          path: long-history-report.jsonl
