name: simulation-long
on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'World seed'
        required: true
        default: '843000'
      years:
        description: 'Years to simulate'
        required: true
        default: '1000'
  schedule:
    - cron: '0 6 * * 0'
  push:
    branches: [main]
    paths: ['.github/workflows/simulation-long.yml']

concurrency:
  group: simulation-long-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .:simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: unit and integration suite
        run: pytest -q simulation/tests
      - name: multi-seed calibration
        run: python simulation/calibration_check.py
      - name: requested long history
        if: github.event_name == 'workflow_dispatch'
        run: python simulation/run_long_history.py ${{ inputs.seed }} ${{ inputs.years }}
      - name: millennium validation
        if: github.event_name == 'push'
        run: python simulation/run_long_history.py 843000 1000
      - name: narrative writing audit
        if: github.event_name == 'push'
        run: |
          echo 'Narrative audit criteria:'
          echo '- prose must arise from objective simulated circumstances and causal history'
          echo '- NPC dialogue must reflect individual wants, knowledge, relationships, temperament, profession, culture, and present pressure'
          echo '- no omniscient knowledge the speaker has not learned'
          echo '- rewards/offers must be possessed, authorized, promised, or intentionally deceptive in-world'
          echo '- avoid interchangeable generated cadence, generic fantasy filler, exposition dumps, and repeated sentence architecture'
          echo '- preserve uncertainty: objective history, remembered history, rumor, belief, and deliberate lies remain distinct'
          echo '- scenes should contain specific material/social consequences and individual motives rather than abstract lore summaries'
          echo '- judge voice differentiation, subtext, restraint, specificity, continuity, causal legibility, and literary quality'
          python simulation/specific_test.py all 843000 100
      - name: weekly 1000-year validation
        if: github.event_name == 'schedule'
        run: python simulation/run_long_history.py 843000 1000
