name: Stage 0.6 save parent proof raw pair
'on':
  push:
    branches: [sol/owner-absence-probe]
    paths: [docs/performance/stage-0-6-current/small-operation-profile/owner_absence_pair.py]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  small-pair:
    runs-on: ubuntu-26.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - run: python -m pip install pyyaml==6.0.3
      - name: Compare the same small proof on one runner
        shell: bash
        run: |
          set -euo pipefail
          authority="$RUNNER_TEMP/ate-qualified-authority"
          baseline="$RUNNER_TEMP/ate-owner-absence-baseline"
          git worktree add --detach "$authority" b8d9b2a5ba723fa40e397846289dea6d2932db8a
          git worktree add --detach "$baseline" f77905ee1fe822af968ffe6c08912d5bd3ab0655
          timeout --signal=TERM --kill-after=15s 12m python docs/performance/stage-0-6-current/small-operation-profile/owner_absence_pair.py compare "$authority" "$baseline" evidence
      - name: Publish trial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 3
        with:
          name: save-parent-proof-pair-${{ github.sha }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
