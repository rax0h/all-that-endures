name: Stage 0.6 current mature-world benchmark
# Launch explicitly after reviewing the candidate and phase budgets.
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Retain fixture and sample first step, or explicitly run full measurement
        type: choice
        options: [retain-and-sample, measure]
        default: retain-and-sample
  push:
    branches: [sol/durable-proof-map]
    paths: [simulation/stage_0_6_fixture_retention_request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-0-6-mature-benchmark
  cancel-in-progress: false
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Targeted harness gate before mature transport
        run: |
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          python -m pytest -q .github/tests/test_stage_0_6_benchmark.py --junitxml="$GITHUB_WORKSPACE/evidence/harness-tests.xml"
      - name: Reserve disposable runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell
          sudo find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 ! -name Python -exec rm -rf {} +
          sudo docker image prune -af
          df -h . > evidence/disk-start.txt
      - name: Authenticate accepted mature fixture and current execution source
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m simulation.stage_0_6_benchmark_launch prepare --root "$GITHUB_WORKSPACE" --config simulation/stage_0_6_benchmark_launch.json
      - name: Retain authenticated input beyond original artifact expiry
        if: steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: stage-0-6-authenticated-input-${{ github.sha }}
          path: |
            source/candidate.sqlite
            source/checkpoint.json
            source/save.json
            accepted/year-verified.json
            evidence/source-authority.json
            evidence/source-transport.json
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
      - name: Measure current open first step save and warm step
        id: measure
        continue-on-error: true
        run: |
          status=0
          timeout --signal=TERM --kill-after=30s 210m python -m simulation.stage_0_6_mature_benchmark run --root "$GITHUB_WORKSPACE" --config simulation/stage_0_6_benchmark_launch.json || status=$?
          python -m simulation.stage_0_6_benchmark_launch record-exit --phase measure --status "$status" --root "$GITHUB_WORKSPACE" --config simulation/stage_0_6_benchmark_launch.json
          exit "$status"
      - name: Fresh-process restore and accepted year1002 digest
        id: restore
        if: always() && steps.measure.outcome == 'success'
        continue-on-error: true
        run: |
          status=0
          timeout --signal=TERM --kill-after=30s 95m python -m simulation.stage_0_6_mature_benchmark verify --root "$GITHUB_WORKSPACE" --config simulation/stage_0_6_benchmark_launch.json || status=$?
          python -m simulation.stage_0_6_benchmark_launch record-exit --phase restore --status "$status" --root "$GITHUB_WORKSPACE" --config simulation/stage_0_6_benchmark_launch.json
          exit "$status"
      - name: Preserve human and machine readable comparison
        if: always() && steps.prepare.outcome == 'success'
        continue-on-error: true
        run: |
          status=0
          python -m simulation.stage_0_6_benchmark_launch summarize --root "$GITHUB_WORKSPACE" --config simulation/stage_0_6_benchmark_launch.json || status=$?
          if test -f evidence/summary.md; then cat evidence/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - name: Capture final disk use
        if: always()
        run: df -h . > evidence/disk-end.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-0-6-mature-evidence-${{ github.sha }}
          path: |
            evidence/**/*.json
            evidence/**/*.xml
            evidence/**/*.md
            evidence/disk-*.txt
          retention-days: 30
          if-no-files-found: error
      - name: Require complete operational measurement and fresh verification
        if: always()
        env:
          MEASURE: ${{ steps.measure.outcome }}
          RESTORE: ${{ steps.restore.outcome }}
        run: |
          test "$MEASURE" = success
          test "$RESTORE" = success
  retain:
    if: github.event_name == 'push' || inputs.mode == 'retain-and-sample'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Targeted harness gate
        run: |
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          python -m pytest -q .github/tests/test_stage_0_6_benchmark.py --junitxml="$GITHUB_WORKSPACE/evidence/harness-tests.xml"
      - name: Reserve disposable runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell
          sudo find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 ! -name Python -exec rm -rf {} +
          sudo docker image prune -af
          df -h . > evidence/disk-start.txt
      - name: Authenticate accepted mature fixture and exact source
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m simulation.stage_0_6_benchmark_launch prepare --root "$GITHUB_WORKSPACE" --config simulation/stage_0_6_benchmark_launch.json
      - name: Retain authenticated input before diagnostic work
        id: retained
        uses: actions/upload-artifact@v4
        with:
          name: stage-0-6-authenticated-input-${{ github.sha }}
          path: |
            source/candidate.sqlite
            source/checkpoint.json
            source/save.json
            accepted/year-verified.json
            evidence/source-authority.json
            evidence/source-transport.json
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
      - name: Record immutable retained artifact binding
        env:
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.retained.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from simulation import continuation_receipts as r
          authority=r.load_receipt('evidence/source-authority.json')
          digest=os.environ['ARTIFACT_DIGEST'].removeprefix('sha256:')
          r.hexadecimal(digest,64,'retained archive digest')
          artifact_id=int(os.environ['ARTIFACT_ID'])
          if artifact_id<=0:raise ValueError('missing retained artifact ID')
          if r.file_hash(Path('source/candidate.sqlite'))!=authority['database']['sha256']:raise ValueError('retained input changed after upload')
          r.publish_receipt('evidence/retained-input.json',dict(schema='ate-stage06-retained-input/1',artifact_id=artifact_id,archive_sha256=digest,retention_days=30,producer=dict(run_id=int(os.environ['GITHUB_RUN_ID']),sha=os.environ['GITHUB_SHA']),source_authority=authority))
          PY
      - name: Bounded first-step cProfile diagnostic without save
        id: sample
        continue-on-error: true
        run: |
          status=0
          timeout --signal=TERM --kill-after=30s 20m python -m simulation.stage_0_6_profile_sample --root "$GITHUB_WORKSPACE" --config simulation/stage_0_6_benchmark_launch.json || status=$?
          python -m simulation.stage_0_6_benchmark_launch record-exit --phase sample --status "$status" --root "$GITHUB_WORKSPACE" --config simulation/stage_0_6_benchmark_launch.json
          exit "$status"
      - name: Upload diagnostic and retention receipts on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-0-6-retention-sample-evidence-${{ github.sha }}
          path: |
            evidence/**/*.json
            evidence/**/*.xml
            evidence/**/*.prof
            evidence/disk-*.txt
          retention-days: 30
          if-no-files-found: error
      - name: Require diagnostic receipt, distinct from performance acceptance
        if: always()
        env:
          SAMPLE: ${{ steps.sample.outcome }}
        run: |
          test "$SAMPLE" = success
          test -f evidence/retained-input.json
