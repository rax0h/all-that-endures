name: Stage 0.5 mature construction commit
'on':
  push:
    branches: [sol/stage-0-5-mature-commit]
    paths:
    - .github/workflows/stage-0-5-mature-commit.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: stage-0-5-mature-construction-commit
  cancel-in-progress: false
env:
  PYTHONPATH: .:simulation
  PYTHONUNBUFFERED: '1'
  RUNTIME_SHA: bbc3cbf11becb58aa4b9483114559fd1296878f1
  HARNESS_SHA: e32ffc7cdc87bf4bde408eb5957458fd6142736b
jobs:
  mature-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.HARNESS_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check mature commit wiring
      run: |
        python -m pip install pytest pyyaml
        python -m pytest -q simulation/tests/test_construction_mature_commit.py simulation/tests/test_construction_checkpoint.py
    - name: Reserve disk on this disposable runner
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        mkdir -p evidence
        df -h . | tee evidence/disk-start.txt
    - name: Commit retained mature preparation
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set +e
        timeout --signal=TERM --kill-after=30s 300m python -m simulation.construction_mature_commit 2>&1 | tee evidence/commit.log
        commit_status=${PIPESTATUS[0]}
        exit "$commit_status"
    - name: Retain diagnostics
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: construction-mature-commit-diagnostics
        path: |
          evidence/commit.log
          evidence/disk-start.txt
          evidence/commit-summary.json
        retention-days: 14
    - name: Retain committed construction
      uses: actions/upload-artifact@v4
      with:
        name: construction-mature-committed
        path: evidence/committed
        if-no-files-found: error
        compression-level: 1
        retention-days: 14
