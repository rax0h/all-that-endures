name: P4.13 community focused

on:
  push:
    branches:
      - sol-p4-13-community-focused

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: |
          PYTHONPATH=simulation:. python -m pytest -q \
            simulation/tests/test_persistence_lazy_communities.py \
            simulation/tests/test_history_networks.py \
            simulation/tests/test_civilization_foundations.py
